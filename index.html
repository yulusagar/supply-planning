        ));
    }
    return h('div',{ style:{ position:'relative', display: flat ? 'flex' : 'block' } }, trigger, menu);
  },

  // One editable slot row: off-hours, breaks, slot chips, dividers, the cut
  // ghost and every interaction that goes with them. Shared by Slot creation's
  // own canvas and by Template planning while a slot mode is active.
  slotEditRow(rday, yc, cfg){
    const st = this.state, HW = this.HOUR_W;
    const rowH = cfg.rowH, trackW = cfg.trackW;
    const muted = cfg.muted || 'color-mix(in srgb, var(--color-text) 55%, transparent)';

      const rowInner = h('div',{ style:{ position:'relative', height:rowH+'px', width:trackW+'px' } });
      const closed = (rday==='hol') || yc.closed.indexOf(rday)!==-1;
      if(closed){
        rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute', left:'0', width:(24*HW)+'px',
          top:'0', bottom:'0', borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center' } },
          h('span',{ style:{ fontSize:'12px', color:muted } }, rday==='hol'?'No operating hours':'Closed')));
        return rowInner;
      }
      const slots = this.getSlots(rday, yc);

      // off-hours
      if(yc.op[0]>0) rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute', left:'0',
        width:(yc.op[0]*HW)+'px', top:'0', bottom:'0' } }));
      if(yc.op[1]<24) rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute',
        left:(yc.op[1]*HW)+'px', width:((24-yc.op[1])*HW)+'px', top:'0', bottom:'0' } }));

      // breaks — inset with breathing room, aligned to the slot bars
      yc.breaks.forEach(br=> rowInner.appendChild(h('div',{ class:'sc-break', title:'Break '+this.hhmm(br[0])+'–'+this.hhmm(br[1]),
        style:{ position:'absolute', left:(br[0]*HW)+'px', width:((br[1]-br[0])*HW)+'px', top:'4px', bottom:'4px',
          borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center' } },
        (br[1]-br[0])*HW>52 ? h('span',{ style:{ fontSize:'10px', color:muted } }, 'Break') : null)));

      // slot bars — two-line (Slot N + range), inset like the day-to-day bars (keep refs for drag)
      const slotEls = [];
      slots.forEach((sl,si)=>{
        const w = (sl.end-sl.start)*HW;
        const rng = w>60 ? this.hhmm(sl.start)+'–'+this.hhmm(sl.end) : (w>34 ? this.hhmm(sl.start) : '');
        const el = h('div',{ class:'sc-slot'+(st.slotEdit?' editable':''),
          title: this.hhmm(sl.start)+'–'+this.hhmm(sl.end)+' · '+(sl.blocked?'Blocked':'Planned'),
          style:{ position:'absolute', left:(sl.start*HW)+'px', width:w+'px', top:'4px', bottom:'4px',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1px', lineHeight:'1.05',
            borderRadius:'6px', pointerEvents:'none', fontVariantNumeric:'tabular-nums',
            background: sl.blocked ? 'repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 6%,transparent) 0 6px, transparent 6px 12px), var(--color-surface)' : 'var(--color-neutral-900)',
            border:'1px solid var(--color-neutral-600)', color:'var(--color-text)' } },
          // Editing drops the slot number — the row is being reshaped, so the
          // numbering is in flux and the span itself is what matters.
          (!st.slotEdit && w>44) ? h('span',{ style:{ fontWeight:'700', fontSize:'13px' } }, 'Slot '+(si+1)) : null,
          h('span',{ class:'sc-rng', style:{ fontSize:'11px', color:'var(--color-text-2)' } }, rng),
          w>70 ? h('span',{ class:'sc-type'+(st.slotEdit?' tappable':''),
            title: st.slotEdit ? 'Click to switch between Planned and Blocked' : null,
            style:{ color: sl.blocked?'var(--color-text-2)':'var(--color-text-3)',
              // only this label takes clicks, so clicking the rest of the chip
              // still cuts the slot
              pointerEvents: st.slotEdit?'auto':'none' },
            onClick: st.slotEdit ? (e)=>{ e.stopPropagation(); this.toggleSlotType(rday, yc.id, si); } : null },
            (sl.blocked?'Blocked':'Planned') + (st.slotEdit?' \u25be':'')) : null);
        slotEls.push(el); rowInner.appendChild(el);
      });

      // internal dividers — draggable (resize) + merge (remove)
      for(let i=0;i<slots.length-1;i++){
        if(Math.abs(slots[i].end - slots[i+1].start) >= 1e-9) continue;
        const li = i, locked = slots[li].planned || slots[li+1].planned || !st.slotEdit;
        const wrap = h('div',{ class:'sc-div'+(locked?' locked':''),
          title: !st.slotEdit ? this.hhmm(slots[li].end)
               : (locked?'Locked boundary (planned slot)':'Drag to move · hover to merge'),
          style:{ left:(slots[li].end*HW-7)+'px', top:'4px', bottom:'4px' } }, h('div',{class:'ln'}));
        if(!locked){
          const mb = h('button',{ class:'sc-merge', title:'Merge these two slots',
            html:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 L7 7 L4 11"/><path d="M10 3 L7 7 L10 11"/></svg>' });
          wrap.appendChild(mb);
          const leftEl = slotEls[li], rightEl = slotEls[li+1];
          wrap.addEventListener('mousedown',(e)=>{
            if(e.target.closest('.sc-merge')) return;
            e.preventDefault(); e.stopPropagation();
            this._scDragging = true;
            const lo = slots[li].start + 0.25, hi = slots[li+1].end - 0.25;
            const rect = rowInner.getBoundingClientRect();
            let curT = slots[li].end;
            const setRng = (el,w,s,e)=>{ const r=el.querySelector('.sc-rng');
              if(r) r.textContent = w>60 ? this.hhmm(s)+'–'+this.hhmm(e) : (w>34 ? this.hhmm(s) : ''); };
            const move = (ev)=>{
              let t = this.snap15((ev.clientX-rect.left)/HW);
              t = Math.max(lo, Math.min(hi, t));
              curT = t;
              leftEl.style.width = ((t-slots[li].start)*HW)+'px';
              setRng(leftEl, (t-slots[li].start)*HW, slots[li].start, t);
              rightEl.style.left = (t*HW)+'px';
              rightEl.style.width = ((slots[li+1].end-t)*HW)+'px';
              setRng(rightEl, (slots[li+1].end-t)*HW, t, slots[li+1].end);
              wrap.style.left = (t*HW-7)+'px';
            };
            const up = ()=>{
              document.removeEventListener('mousemove', move);
              document.removeEventListener('mouseup', up);
              this._scDragging = false;
              this._scSuppressClick = true; setTimeout(()=>{ this._scSuppressClick=false; }, 0);
              if(Math.abs(curT - slots[li].end) > 1e-9){
                const next = slots.slice();
                next[li]   = {start:slots[li].start, end:curT,            planned:slots[li].planned,   blocked:slots[li].blocked};
                next[li+1] = {start:curT,            end:slots[li+1].end, planned:slots[li+1].planned, blocked:slots[li+1].blocked};
                this.setSlots(rday, yc.id, next);
              }
            };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
          });
          mb.addEventListener('click',(e)=>{
            e.stopPropagation();
            // with rows ticked this removes the boundary on every selected row,
            // mirroring how a click slices them all
            if(Object.keys(this.state.bulkSel).length){ this.applyBulkMerge(slots[li].end); return; }
            const next = slots.slice(0,li)
              .concat([{start:slots[li].start, end:slots[li+1].end, planned:false,
                        blocked: !!(slots[li].blocked && slots[li+1].blocked)}])
              .concat(slots.slice(li+2));
            this.setSlots(rday, yc.id, next);
          });
        }
        rowInner.appendChild(wrap);
      }

      // ghost cut line (shared by split + bulk placement)
      const ghost = h('div',{ class:'sc-ghost' }, h('div',{class:'line'}), h('div',{class:'lbl'}));
      const ghostLbl = ghost.querySelector('.lbl');
      rowInner.appendChild(ghost);
      if(st.slotEdit) this._bulkGhosts[rday+'|'+yc.id] = { el:ghost, lbl:ghostLbl };

      if(st.slotEdit){
        // One editing mode. Hovering previews the cut; clicking applies it.
        // With rows ticked the cut lands on every selected row; with none ticked
        // it lands on the row under the cursor.
        const inSlot = (t)=> slots.find(s=> t>s.start+1e-9 && t<s.end-1e-9 && !s.planned
          && (t-s.start)>=0.25-1e-9 && (s.end-t)>=0.25-1e-9);
        const anySel = ()=> Object.keys(this.state.bulkSel).length>0;
        const previewAll = (t)=>{
          const sel = this.state.bulkSel;
          for(const k in this._bulkGhosts){
            const g = this._bulkGhosts[k];
            if(sel[k]){ g.el.style.display='block'; g.el.style.left=(t*HW)+'px'; g.lbl.textContent=this.hhmm(t); }
            else { g.el.style.display='none'; }
          }
        };
        const hideAll = ()=>{ for(const k in this._bulkGhosts) this._bulkGhosts[k].el.style.display='none'; };
        rowInner.addEventListener('mousemove',(e)=>{
          if(this._scDragging){ hideAll(); ghost.style.display='none'; return; }
          // over the type pill a click switches the type, it does not cut — so
          // drop the cut line rather than promising a slice that won't happen
          if(e.target.closest && e.target.closest('.sc-type.tappable')){
            hideAll(); ghost.style.display='none'; rowInner.style.cursor='pointer'; return;
          }
          const rect = rowInner.getBoundingClientRect();
          const t = this.snap15((e.clientX-rect.left)/HW);
          if(anySel()){ previewAll(t); rowInner.style.cursor='crosshair'; return; }
          if(inSlot(t)){ ghost.style.display='block'; ghost.style.left=(t*HW)+'px';
            ghostLbl.textContent=this.hhmm(t); rowInner.style.cursor='crosshair'; }
          else { ghost.style.display='none'; rowInner.style.cursor='default'; }
        });
        rowInner.addEventListener('mouseleave',()=>{ hideAll(); ghost.style.display='none'; });
        rowInner.addEventListener('click',(e)=>{
          if(this._scSuppressClick) return;
          const rect = rowInner.getBoundingClientRect();
          const t = this.snap15((e.clientX-rect.left)/HW);
          if(anySel()){ this.applyBulkSlice(t); return; }
          const idx = slots.findIndex(s=> t>s.start+1e-9 && t<s.end-1e-9 && !s.planned
            && (t-s.start)>=0.25-1e-9 && (s.end-t)>=0.25-1e-9);
          if(idx<0) return;
          const s = slots[idx];
          const next = slots.slice(0,idx)
            .concat([{start:s.start,end:t,planned:false,blocked:s.blocked},
                     {start:t,end:s.end,planned:false,blocked:s.blocked}])
            .concat(slots.slice(idx+1));
          this.setSlots(rday, yc.id, next);
        });
      }
      return rowInner;
  },

  // "Edit slots" — the slot mode in the merged Template planning header.
  // Types are switched from each chip, so there is no separate type mode.
  slotModeButtons(){
    const st = this.state;
    const btn = (on, onClick, title, svg, label)=> h('button',{ onClick, title,
      hover: on?null:{ borderColor:'var(--color-neutral-600)' },
      style:{ display:'flex', alignItems:'center', gap:'6px', height:'38px', padding:'0 12px', borderRadius:'8px',
        border:'1px solid '+(on?'var(--color-accent)':'var(--color-divider)'),
        background: on?'color-mix(in srgb, var(--color-accent) 12%, transparent)':'var(--color-surface)',
        color: on?'var(--color-accent)':'var(--color-text)', cursor:'pointer', fontSize:'14px',
        whiteSpace:'nowrap', fontFamily:'var(--font-heading)', fontWeight:'500' } },
      h('span',{ html:svg }), label);
    return [
      btn(st.slotEdit, ()=> this.toggleBulk(), 'Slice and resize slots',
        '<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="6" height="5" rx="1"/><rect x="2.5" y="10" width="6" height="5" rx="1"/><path d="M11.5 5.5h4M11.5 12.5h4"/></svg>',
        'Edit slots'),
    ];
  },
  // true while either slot mode is on — template inputs are blocked then
  slotModeOn(){ return !!this.state.slotEdit; },

  toggleBulk(){ this.setState({ slotEdit: !this.state.slotEdit, bulkSel:{}, bulkResult:null, slotSel:null }); },
  // rows that can actually take a cut — closed days are never selectable
  selectableRowKeys(defs){
    return (defs || this._bulkDefs || [])
      .filter(d=> !(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1))
      .map(d=> d.rday+'|'+d.yc.id);
  },
  toggleSelectAllRows(){
    const keys = this.selectableRowKeys();
    const all = keys.length>0 && keys.every(k=> this.state.bulkSel[k]);
    const next = {};
    if(!all) keys.forEach(k=> next[k]=true);   // partial or none -> select all
    this.setState({ bulkSel: next, bulkResult:null });
  },
  buildSelectAllRow(defs){
    const keys = this.selectableRowKeys(defs);
    const n = keys.filter(k=> this.state.bulkSel[k]).length;
    const state = n===0 ? 'none' : (n===keys.length ? 'all' : 'some');
    const accent = 'var(--color-accent)';
    return h('div',{ onClick: ()=> this.toggleSelectAllRows(),
      hover:{ color:'var(--color-text)' },
      style:{ display:'flex', alignItems:'center', gap:'10px', padding:'0 12px', cursor:'pointer',
        height:'100%', borderRadius:'6px',
        userSelect:'none', fontSize:'12px', fontWeight:'500',
        color: state==='none' ? 'color-mix(in srgb, var(--color-text) 55%, transparent)' : 'var(--color-text)' } },
      h('div',{ style:{ width:'18px', height:'18px', flex:'none', borderRadius:'5px',
          display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-accent-100)',
          border:'1px solid '+(state==='none'?'var(--color-neutral-600)':accent),
          background: state==='none'?'transparent':accent },
        html: state==='all'
          ? '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 L6 10.5 L11 4"/></svg>'
          : (state==='some' ? '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 7h7"/></svg>' : '') }),
      h('span',{}, state==='all' ? 'Deselect all' : 'Select all'));
  },
  toggleBulkRow(key){
    const b = Object.assign({}, this.state.bulkSel);
    if(b[key]) delete b[key]; else b[key] = true;
    this.setState({ bulkSel:b, bulkResult:null });
  },
  applyBulkSlice(T){
    const defs = this._bulkDefs || [];
    let applied=0, skipped=0;
    defs.forEach(d=>{
      const key = d.rday+'|'+d.yc.id;
      if(!this.state.bulkSel[key]) return;
      if(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1){ skipped++; return; }
      const slots = this.getSlots(d.rday, d.yc);
      const idx = slots.findIndex(s=> T>s.start+1e-9 && T<s.end-1e-9 && !s.planned
        && (T-s.start)>=0.25-1e-9 && (s.end-T)>=0.25-1e-9);
      if(idx<0){ skipped++; return; }
      const s = slots[idx];
      this.state.slotEdits[d.rday+'|'+d.yc.id] = slots.slice(0,idx)
        .concat([{start:s.start,end:T,planned:false,blocked:s.blocked},
                 {start:T,end:s.end,planned:false,blocked:s.blocked}])
        .concat(slots.slice(idx+1));
      applied++;
    });
    if(applied>0){ this.state.slotDirty = true; this.persistSlots(); }
    this.state.bulkAt = T;
    this.state.bulkResult = { applied, skipped, at:T };
    this.render();
  },
  // ======================================================================
  // Define slot type — Planned (plan + book) vs Blocked (no planning table
  // anywhere). Selection is per slot, so indices are safe: slicing is off in
  // this mode, which means a slot's index can't shift under a live selection.
  // ======================================================================
  // flip a single slot between Planned and Blocked, straight from its chip
  toggleSlotType(rday, ycId, idx){
    const yc = this.SLOT_YC.find(y=> y.id===ycId); if(!yc) return;
    const slots = this.getSlots(rday, yc).slice();
    if(!slots[idx]) return;
    slots[idx] = Object.assign({}, slots[idx], { blocked: !slots[idx].blocked });
    this.setSlots(rday, ycId, slots);
  },
  // remove the boundary at T on every selected row (the multi-row counterpart of
  // the per-divider merge). A row without a boundary there is skipped, not forced.
  applyBulkMerge(T){
    const defs = this._bulkDefs || [];
    let applied=0, skipped=0;
    defs.forEach(d=>{
      const key = d.rday+'|'+d.yc.id;
      if(!this.state.bulkSel[key]) return;
      if(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1){ skipped++; return; }
      const slots = this.getSlots(d.rday, d.yc);
      const i = slots.findIndex((sl,ix)=> ix < slots.length-1
        && Math.abs(sl.end - T) < 1e-9
        && Math.abs(sl.end - slots[ix+1].start) < 1e-9
        && !sl.planned && !slots[ix+1].planned);
      if(i<0){ skipped++; return; }
      this.state.slotEdits[key] = slots.slice(0,i)
        .concat([{start:slots[i].start, end:slots[i+1].end, planned:false,
                  blocked: !!(slots[i].blocked && slots[i+1].blocked)}])
        .concat(slots.slice(i+2));
      applied++;
    });
    if(applied>0){ this.state.slotDirty = true; this.persistSlots(); }
    this.state.bulkAt = T;
    this.state.bulkResult = { applied, skipped, at:T, verb:'merged' };
    this.render();
  },
  buildBulkBar(){
    const st = this.state, accent='var(--color-accent)', muted='color-mix(in srgb, var(--color-text) 55%, transparent)';
    const count = Object.keys(st.bulkSel).length;
    const sep = ()=> h('div',{ style:{ width:'1px', height:'24px', background:'var(--color-divider)' } });

    return h('div',{ style:{ position:'fixed', left:'50%', bottom:'20px', transform:'translateX(-50%)', zIndex:'45',
      display:'flex', alignItems:'center', gap:'12px', padding:'10px 16px', borderRadius:'12px',
      background:'var(--color-surface)', border:'1px solid var(--color-neutral-700)', boxShadow:'var(--shadow-md)' } },
      h('span',{ style:{ fontSize:'13px', fontWeight:'500', whiteSpace:'nowrap' } },
        count ? (count+' rows selected') : 'Editing slots'),
      sep(),
      h('span',{ style:{ fontSize:'13px', color:muted, whiteSpace:'nowrap' } },
        count ? 'Click the timeline to slice all selected · merge removes that boundary on all of them'
              : 'Click a slot to slice it · tick rows to slice or merge several · click a slot\u2019s type to switch it'),
      st.bulkResult ? [ sep(),
        h('span',{ style:{ fontSize:'12px', color: st.bulkResult.applied?accent:muted, whiteSpace:'nowrap' } },
          '✓ '+st.bulkResult.applied+' '+(st.bulkResult.verb||'sliced')
            +(st.bulkResult.skipped?' · '+st.bulkResult.skipped+' skipped':'')) ] : null,
      sep(),
      h('button',{ onClick: ()=> this.toggleBulk(),
        hover:{ background:'color-mix(in srgb, var(--color-text) 6%, transparent)' },
        style:{ height:'32px', padding:'0 14px', background:'transparent', border:'1px solid var(--color-divider)',
          borderRadius:'8px', color:'var(--color-text)', cursor:'pointer', fontSize:'14px', fontWeight:'500' } }, 'Done')
    );
  },

  // selection side panel — precise edit of the selected boundary
  buildSlotPanel(sel, panelW){
    const muted='color-mix(in srgb, var(--color-text) 55%, transparent)', accent='var(--color-accent)';
    const { yc, day, bi, slots } = sel;
    const a = slots[bi], b = slots[bi+1];
    const locked = a.planned || b.planned;
    const at = a.end, lo = a.start + 0.25, hi = b.end - 0.25;
    const DAYS = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday',hol:'Holiday'};

    const setAt = (t)=>{
      t = this.snap15(Math.max(lo, Math.min(hi, t)));
      if(Math.abs(t-at)<1e-9) return;
      const next = slots.slice();
      next[bi]   = {start:a.start, end:t,     planned:a.planned, blocked:a.blocked};
      next[bi+1] = {start:t,       end:b.end, planned:b.planned, blocked:b.blocked};
      this.state.slotSel = { ycId:yc.id, day, at:t };
      this.setSlots(day, yc.id, next);
    };
    const merge = ()=>{
      const next = slots.slice(0,bi)
        .concat([{start:a.start, end:b.end, planned:false, blocked: !!(a.blocked && b.blocked)}])
        .concat(slots.slice(bi+2));
      this.state.slotSel = null;
      this.setSlots(day, yc.id, next);
    };
    const close = ()=> this.setState({ slotSel:null });

    const chip = (s,e,planned)=> h('div',{ style:{ flex:'1', textAlign:'center', padding:'8px 6px', borderRadius:'6px',
      fontSize:'13px', fontVariantNumeric:'tabular-nums',
      background: planned ? 'var(--color-neutral-900)' : 'color-mix(in srgb, var(--color-accent) 12%, transparent)',
      border:'1px solid '+(planned?'var(--color-divider)':'var(--color-accent-700)'),
      color: planned?muted:'var(--color-text)' } }, this.hhmm(s)+'–'+this.hhmm(e));

    const stepBtn = (label, fn, disabled)=> h('button',{ onClick: disabled?null:fn, disabled,
      style:{ width:'34px', height:'34px', flex:'none', display:'flex', alignItems:'center', justifyContent:'center',
        background:'var(--color-surface)', border:'1px solid var(--color-divider)', borderRadius:'6px',
        color:'var(--color-text)', cursor:disabled?'not-allowed':'pointer', fontSize:'16px', opacity:disabled?'.45':'1' } }, label);

    const inp = h('input',{ type:'text', inputmode:'numeric', value:this.hhmm(at), disabled: locked,
      style:{ flex:'1', minWidth:'0', textAlign:'center', height:'34px', border:'1px solid var(--color-divider)',
        borderRadius:'6px', background:'var(--color-surface)', color:'var(--color-text)', fontSize:'14px',
        fontVariantNumeric:'tabular-nums', opacity:locked?'.6':'1' } });
    inp.addEventListener('change',(e)=>{
      const m = /^(\d{1,2}):(\d{2})$/.exec(e.target.value.trim());
      if(!m){ e.target.value = this.hhmm(at); return; }
      setAt((+m[1]) + (+m[2])/60);
    });

    const body = locked
      ? [ h('div',{ style:{ display:'flex', alignItems:'center', gap:'8px', padding:'10px 12px', borderRadius:'8px',
            background:'var(--color-neutral-900)', border:'1px solid var(--color-divider)', fontSize:'12px', color:muted } },
          h('span',{ html:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2.5" y="6" width="9" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4.3 6V4.5a2.7 2.7 0 0 1 5.4 0V6" stroke="currentColor" stroke-width="1.3"/></svg>' }),
          h('span',{}, 'A neighbouring slot already has planning, so this boundary is locked. Structure changes only apply to slots without planning.')) ]
      : [
          h('div',{ style:{ fontSize:'11px', color:muted, marginBottom:'6px' } }, 'CUT AT'),
          h('div',{ style:{ display:'flex', alignItems:'center', gap:'6px' } },
            stepBtn('−', ()=> setAt(at-0.25), at-0.25 < lo-1e-9),
            inp,
            stepBtn('+', ()=> setAt(at+0.25), at+0.25 > hi+1e-9)),
          h('div',{ style:{ fontSize:'11px', color:muted, marginTop:'6px' } },
            'Range '+this.hhmm(lo)+'–'+this.hhmm(hi)+' · 15-min steps'),
          h('button',{ onClick: merge,
            hover:{ background:'color-mix(in srgb, var(--color-text) 6%, transparent)' },
            style:{ marginTop:'14px', width:'100%', height:'36px', display:'flex', alignItems:'center',
              justifyContent:'center', gap:'8px', background:'transparent', border:'1px solid var(--color-divider)',
              borderRadius:'8px', color:'var(--color-text)', cursor:'pointer', fontSize:'14px',
              fontFamily:'var(--font-heading)', fontWeight:'500' } },
            h('span',{ html:'<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 L7 7 L4 11"/><path d="M10 3 L7 7 L10 11"/></svg>' }),
            'Merge into one slot')
        ];

    return h('div',{ style:{ flex:'0 0 '+panelW+'px', width:panelW+'px' } },
      h('div',{ style:{ height:'16px' } }),
      h('div',{ style:{ border:'1px solid var(--color-divider)', borderRadius:'8px', overflow:'hidden',
        background:'var(--color-surface)', boxShadow:'0 1px 2px rgba(0,0,0,.05)' } },
        // header
        h('div',{ style:{ display:'flex', alignItems:'center', padding:'12px 14px', gap:'8px',
          background:'var(--color-neutral-900)', borderBottom:'1px solid var(--color-divider)' } },
          h('div',{ style:{ flex:'1', minWidth:'0' } },
            h('div',{ style:{ fontWeight:'500' } }, 'Boundary'),
            h('div',{ style:{ fontSize:'11px', color:muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' } },
              yc.name+' · '+DAYS[day])),
          h('button',{ onClick: close, 'aria-label':'Close',
            hover:{ borderColor:'var(--color-neutral-600)' },
            style:{ width:'28px', height:'28px', flex:'none', display:'flex', alignItems:'center', justifyContent:'center',
              background:'transparent', border:'1px solid var(--color-divider)', borderRadius:'6px',
              color:'var(--color-text)', cursor:'pointer', fontSize:'15px', lineHeight:'1' } }, '×')),
        // adjacent slots
        h('div',{ style:{ padding:'12px 14px' } },
          h('div',{ style:{ display:'flex', alignItems:'center', gap:'6px' } },
            chip(a.start, a.end, a.planned),
            h('span',{ style:{ color:accent, fontSize:'14px' } }, '│'),
            chip(b.start, b.end, b.planned)),
          h('div',{ style:{ height:'12px' } }),
          ...body
        )
      )
    );
  },

  // the rail/panel widths animate over .28s — refit once they've settled
  refitAfterTransition(){ clearTimeout(this._refitT); this._refitT = setTimeout(()=> this.fitTimeline(), 320); },
  // Measure the track and pick the widest hour column that still shows all 24h.
  // Returns true when it had to re-render at a new width.
  // remember the narrowest slot the last build put on screen (in hours), so
  // fitTimeline can size the hour column around it
  noteMinSlot(durations){
    const valid = durations.filter(d=> d > 0.01);
    this._minSlotHours = valid.length ? Math.min.apply(null, valid) : 0;
  },
  fitTimeline(){
    if(this._fitting || !this._scrollEl) return false;
    const avail = this._scrollEl.clientWidth;
    if(avail < 80) return false;
    // widest hour column that still shows all 24h...
    const fitAll = Math.max(this.MIN_HW, Math.min(this.MAX_HW, Math.floor((avail - 16) / 24)));
    // ...unless the narrowest slot on screen would have to squeeze its labels, in
    // which case go wider and let the track scroll
    const mins = this._minSlotHours;
    const needed = (mins && mins > 0) ? Math.ceil(this.SLOT_MIN_PX / mins) : 0;
    const target = Math.min(this.MAX_HW_SCROLL, Math.max(fitAll, needed));
    if(target === this.HOUR_W) return false;
    this._fitting = true;
    this.HOUR_W = target;
    this.render();
    this._fitting = false;
    return true;
  },
  render(){
    const root = document.getElementById('root');
    const prevX = this._scrollEl ? this._scrollEl.scrollLeft : null;
    root.replaceChildren(this.build());
    if(this.fitTimeline()) return;   // re-rendered at the fitted hour width
    if(!this._publishBtn || !root.contains(this._publishBtn)) this._publishBtn = root.querySelector('.btn-primary');
    if(prevX != null && this._scrollEl){
      this._scrollEl.scrollLeft = prevX;
      if(this._rulerEl) this._rulerEl.scrollLeft = prevX;
    } else if(!this._mounted){
      this._mounted = true;
      this._scrollToNowTries = 0;
      const tick = ()=>{ if(!this._scrollEl) return;
        if(this._scrollEl.scrollWidth > this._scrollEl.clientWidth){ this.scrollToNow(); }
        else if(this._scrollToNowTries++ < 20){ setTimeout(tick, 60); } };
      setTimeout(tick, 60);
      this._ticker = setInterval(()=>{
        const ae = document.activeElement;
        if(ae && ae.classList && ae.classList.contains('plan')) return;
        this.render();
      }, 20000);
    }
  },
};

App.loadSlots();
App.state.day = App.wkToday();   // Slot creation opens on today's weekday, matching day-to-day's "today"
App.render();
// flush any debounced write before the tab goes away, so nothing in flight is lost
// refit the timeline when the window (or the sidebar) changes the available width
window.addEventListener('resize', ()=>{ clearTimeout(App._resizeT); App._resizeT = setTimeout(()=> App.render(), 120); });
window.addEventListener('beforeunload', ()=> App.persistNow());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') App.persistNow(); });
</script>
</body>
