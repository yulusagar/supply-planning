<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Planning</title>
<style>
/* ==========================================================================
   Yulu design-system tokens — mapped onto this app's existing variable names.
   Light-first: white canvas, #222 content, semantic greys, Satoshi.
   Core colors: Grey100 #F7F7F7 · Grey200 #E8E8E8 · Grey300 #DDDDDD · Grey400 #B0B0B0
   · Grey500 #919191 · Grey600 #717171 · Grey900 #222222. Brand: YuluBlue #30CDFD
   (used sparingly). Contextual: Green #00654F · Orange #E07912 · Red #C13515.
   ========================================================================== */
@import url('https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap');

:root{
  /* surfaces & content (semantic) */
  --color-bg:#f7f7f7;          /* page ground (surface/secondary) */
  --color-surface:#ffffff;     /* cards / canvas */
  --color-text:#222222;        /* content/primary */
  --color-text-2:#717171;      /* content/secondary */
  --color-text-3:#919191;      /* content/tertiary */
  --color-divider:#e8e8e8;     /* border/primary */
  --color-accent:#222222;      /* emphasis: primary actions & selected states */
  --color-brand:#30cdfd;       /* YuluBlue — sparse brand accent */
  --color-positive:#00654f; --color-caution:#e07912; --color-negative:#c13515;

  /* neutral ramp — used by the app as light fills (-900) and borders (-700/-600) */
  --color-neutral-100:#f7f7f7; --color-neutral-200:#e8e8e8; --color-neutral-300:#dddddd;
  --color-neutral-400:#b0b0b0; --color-neutral-500:#919191; --color-neutral-600:#b0b0b0;
  --color-neutral-700:#dddddd; --color-neutral-800:#e8e8e8; --color-neutral-900:#f7f7f7;

  /* "accent" ramp — remapped to a neutral-dark ramp so tints read as greys and
     fills read as #222; -100 stays light for text on dark fills */
  --color-accent-100:#ffffff; --color-accent-200:#f2f2f2; --color-accent-300:#e0e0e0;
  --color-accent-400:#c4c4c4; --color-accent-500:#919191; --color-accent-600:#5c5c5c;
  --color-accent-700:#3d3d3d; --color-accent-800:#2e2e2e; --color-accent-900:#222222;

  --font-heading:"Satoshi","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Satoshi","Segoe UI",system-ui,-apple-system,sans-serif;

  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  --shadow-md:0 2px 10px rgba(34,34,34,0.10), 0 0 0 1px #e8e8e8;

  --left-w:250px;   /* left rail: model label + Cap. avail. (58) + Attac./tot (62) */
  --panel-w:100px;  /* side-panel: the D-1|D-2|D-3 split column only */
}

.app-root{
  /* section nav is a persistent push sidebar: content shifts instead of overlapping */
  padding-left:0;
  transition:padding-left .28s cubic-bezier(.4,0,.2,1);
}
.app-root.nav-open{ padding-left:270px; }

html,body{margin:0}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;font-weight:500}
*{box-sizing:border-box}

/* buttons — Yulu pill / capsule with a bold Label */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-family:var(--font-heading);font-weight:700;font-size:14px;line-height:1.2;color:var(--color-text);
  background:transparent;border:1px solid transparent;height:38px;padding:0 18px;border-radius:var(--radius-pill)}
.btn:disabled{cursor:not-allowed}
/* resting = Yulu Secondary (grey pill); disabled = surface/disabled */
.btn-primary{background:var(--color-neutral-100);color:var(--color-text);border-color:transparent}
.btn-primary:not(:disabled):hover{background:var(--color-neutral-200)}
.btn-primary:disabled{background:var(--color-neutral-300);color:var(--color-neutral-400)}
/* emphasis = outline pill: solid #222 stroke on surface, #222 label.
   Used by Publish / Update when there are changes to apply. */
.btn-primary.btn-solid{background:var(--color-surface);color:var(--color-accent);
  border-color:var(--color-accent)}
.btn-primary.btn-solid:disabled{background:var(--color-neutral-300);color:var(--color-neutral-400);
  border-color:transparent}
.btn-primary.btn-solid:not(:disabled):hover{background:color-mix(in srgb,var(--color-accent) 8%,var(--color-surface))}
.btn-primary.btn-solid:not(:disabled):active{background:color-mix(in srgb,var(--color-accent) 14%,var(--color-surface))}

/* side-panel toggle */
.panel-toggle{position:absolute;top:12px;right:20px;z-index:20;width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-md);color:var(--color-text);
  cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.panel-toggle:hover{border-color:var(--color-neutral-600)}
.panel-toggle.active{border-color:var(--color-accent);color:var(--color-accent);
  background:color-mix(in srgb, var(--color-accent) 12%, transparent)}
.panel-toggle svg{display:block}

/* the side rail: width animates; this is the ONLY thing that reflows the timeline */
.aside-rail{flex:0 0 auto;width:0;overflow:hidden;transition:width .28s cubic-bezier(.4,0,.2,1)}
.app-root.panel-open .aside-rail{width:var(--panel-w)}

/* section nav — menu button + left drawer with vertical tabs */
.menu-btn{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);
  color:var(--color-text);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.menu-btn:hover{border-color:var(--color-neutral-600)}
.menu-btn.active{border-color:var(--color-accent);color:var(--color-accent);
  background:color-mix(in srgb, var(--color-accent) 12%, transparent)}
.menu-btn svg{display:block}
/* Icon component: fixed 24dp bounding box, artwork centred, colour inherited */
.ds-icon{width:24px;height:24px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.ds-icon svg{display:block}
/* hamburger lives in the header when collapsed, inside the drawer when open */
.app-root.nav-open .menu-btn-header{display:none}
.app-root:not(.nav-open) .menu-btn-drawer{display:none}
/* modal — scrim + centred surface card, same tokens as the rest of the app */
.modal-scrim{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--color-text) 38%,transparent);
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:100%;max-width:460px;background:var(--color-surface);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);overflow:hidden}
.modal-head{padding:20px 24px 0}
.modal-body{padding:16px 24px 0;display:flex;flex-direction:column;gap:10px}
.modal-foot{padding:20px 24px;display:flex;align-items:center;justify-content:flex-end;gap:10px}
/* selectable option row — radio mark + label + description */
.opt{display:flex;gap:12px;padding:14px;border:1px solid var(--color-divider);border-radius:var(--radius-md);
  cursor:pointer;background:var(--color-surface);text-align:left;width:100%;font-family:var(--font-body)}
.opt:hover{border-color:var(--color-neutral-400)}
.opt.on{border-color:var(--color-accent);background:color-mix(in srgb,var(--color-accent) 5%,transparent)}
.opt{align-items:center}
.opt .radio{flex:none;width:18px;height:18px;border-radius:50%;
  border:1.5px solid var(--color-neutral-400);display:flex;align-items:center;justify-content:center}
.opt.on .radio{border-color:var(--color-accent)}
.opt.on .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--color-accent)}
.opt .ttl{font-weight:700;font-size:14px;color:var(--color-text)}
.opt .sub{font-size:12px;color:var(--color-text-2);margin-top:3px;line-height:1.35}
/* date / time fields */
.fld{height:38px;padding:0 10px;font-family:var(--font-body);font-size:14px;font-weight:500;
  color:var(--color-text);background:var(--color-neutral-100);border:1px solid transparent;
  border-radius:8px;caret-color:var(--color-accent)}
.fld:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px}
.fld-lbl{font-size:11px;font-weight:500;color:var(--color-text-2);margin-bottom:5px;display:block}
/* standing note that a schedule is queued */
.sched-chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:var(--radius-pill);
  background:color-mix(in srgb,var(--color-caution) 12%,transparent);color:var(--color-text);
  font-size:12px;font-weight:500;white-space:nowrap}
.sched-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--color-caution);flex:none}
/* filter row expand / collapse */
.filter-wrap{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .26s cubic-bezier(.4,0,.2,1)}
.filter-wrap>.filter-inner{overflow:hidden;min-height:0}
.filter-wrap.open{grid-template-rows:1fr}
.filter-wrap:not(.open){pointer-events:none}
@media (prefers-reduced-motion:reduce){.filter-wrap{transition:none}}
.nav-backdrop{display:none}
.nav-drawer{position:fixed;top:0;left:0;bottom:0;z-index:60;width:270px;display:flex;flex-direction:column;
  background:var(--color-surface);border-right:1px solid var(--color-divider);box-shadow:var(--shadow-md);
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.app-root.nav-open .nav-drawer{transform:none}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 17px;cursor:pointer;
  border-left:3px solid transparent;color:var(--color-text);transition:background .12s}
.nav-item:hover{background:color-mix(in srgb, var(--color-text) 5%, transparent)}
.nav-item.active{border-left-color:var(--color-accent);color:var(--color-accent);
  background:color-mix(in srgb, var(--color-accent) 12%, transparent)}
.nav-item.soon{opacity:.6}
.nav-item svg{display:block;flex:none}

/* slot creation */
.sc-daytab{display:flex;align-items:center;height:38px;padding:0 15px;font-size:13px;cursor:pointer;user-select:none;transition:background .12s}
.sc-offhours{background:repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 6%,transparent) 0 6px, transparent 6px 12px)}
.sc-break{background:repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 10%,transparent) 0 5px, color-mix(in srgb,var(--color-text) 3%,transparent) 5px 10px)}
.sc-slot{transition:filter .12s}
.sc-slot.editable:hover{filter:brightness(1.05)}
/* Blocked slots keep the same stroke; only the fill changes to the off-hours hatch. */
.sc-slot.pickable{pointer-events:auto;cursor:pointer}
.sc-slot.pickable:hover{filter:brightness(.97)}
.sc-slot.picked{border-color:var(--color-accent) !important;box-shadow:0 0 0 2px color-mix(in srgb,var(--color-accent) 30%,transparent)}
.sc-type{font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.sc-ghost{position:absolute;top:0;bottom:0;pointer-events:none;display:none;z-index:6}
.sc-ghost .line{position:absolute;top:0;bottom:0;left:0;border-left:2px dashed var(--color-accent)}
.sc-ghost .lbl{position:absolute;top:3px;left:3px;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--color-accent);color:var(--color-accent-100);padding:1px 5px;border-radius:4px}
.sc-divider{position:absolute;top:0;bottom:0;width:2px;background:var(--color-accent);z-index:5}
.sc-divider.locked{background:var(--color-neutral-600)}
.sc-div{position:absolute;width:14px;z-index:7;display:flex;align-items:center;justify-content:center;cursor:col-resize}
.sc-div .ln{width:2px;height:100%;background:var(--color-accent);border-radius:1px}
.sc-div.locked{cursor:default}
.sc-div.locked .ln{background:var(--color-neutral-600)}
.sc-merge{position:absolute;top:50%;transform:translate(-50%,-50%);left:50%;width:20px;height:20px;display:none;
  align-items:center;justify-content:center;background:var(--color-surface);border:1px solid var(--color-accent);
  border-radius:50%;color:var(--color-accent);cursor:pointer;box-shadow:var(--shadow-md);z-index:8}
.sc-div:hover .sc-merge{display:flex}
.sc-merge:hover{background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.sc-div.sel{z-index:9}
.sc-div.sel .ln{width:4px;border-radius:2px;box-shadow:0 0 0 2px color-mix(in srgb,var(--color-accent) 30%,transparent)}

/* timeline scrollbar */
.tl-scroll::-webkit-scrollbar{height:12px}
.tl-scroll::-webkit-scrollbar-track{background:var(--color-neutral-900)}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--color-neutral-700);border-radius:6px;border:3px solid var(--color-neutral-900)}
.tl-scroll::-webkit-scrollbar-thumb:hover{background:var(--color-neutral-600)}

/* editable planned cell — one neutral field; the status dot carries the state */
input.plan{width:100%;height:28px;text-align:center;font-size:14px;font-family:var(--font-body);font-weight:500;
  color:var(--color-text);background:var(--color-neutral-100);border:1px solid transparent;
  border-radius:8px;padding:2px;caret-color:var(--color-accent)}
input.plan:hover{border-color:var(--color-neutral-300)}
input.plan:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px;border-color:var(--color-accent)}
/* no number entered yet — the template value shows through as helper text */
input.plan.is-helper{color:var(--color-neutral-400)}
input.plan::placeholder{color:var(--color-neutral-400);opacity:1;font-weight:500}
/* a live number carrying an edit that has not been published yet */
input.plan.is-pending-pub{border-style:dashed;border-color:var(--color-accent)}

/* status dot — 8px ring at the field's left edge.
   grey = not published · orange = saved · green = published */
.plan-cell{position:relative;width:82%;display:flex;align-items:center}
.plan-dot{position:absolute;left:8px;top:50%;margin-top:-4px;width:8px;height:8px;
  border-radius:50%;border:1.5px solid;box-sizing:border-box;pointer-events:none}
.plan-dot.st-none{border-color:var(--color-neutral-400)}
.plan-dot.st-saved{border-color:var(--color-caution)}
.plan-dot.st-pub{border-color:var(--color-positive)}

/* day-to-day legend footer */
.plan-footer{position:fixed;left:0;right:0;bottom:0;z-index:40;height:52px;display:flex;
  align-items:center;justify-content:center;gap:36px;
  background:var(--color-neutral-100);border-top:1px solid var(--color-divider)}
.plan-footer .lg{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--color-text)}
.plan-footer .lg .plan-dot{position:static;margin:0}

/* live-slot animation */
@keyframes livePulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--color-brand) 55%,transparent),0 2px 10px color-mix(in srgb,var(--color-brand) 40%,transparent)}50%{box-shadow:0 0 0 3px var(--color-brand),0 3px 15px color-mix(in srgb,var(--color-brand) 65%,transparent)}}
.live-slot{animation:livePulse 1.8s ease-in-out infinite;z-index:3}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--color-brand);animation:liveDot 1.8s ease-in-out infinite}
@keyframes liveDot{0%,100%{opacity:1}50%{opacity:.35}}

:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent)}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ==========================================================================
   Supply Planning — day-to-day planning system (#3).
   Standalone: no framework, no build step. State + full re-render, with
   horizontal scroll position preserved and input focus kept while editing.
   The Cap. avail. + Rollovers data lives in a toggleable side panel; opening
   it only reflows the timeline width (CSS-animated, no re-render).
   ========================================================================== */

// ---- tiny hyperscript helper ----
function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  attrs = attrs || {};
  for(const k in attrs){
    const v = attrs[k];
    if(v == null) continue;
    if(k === 'style'){
      if(typeof v === 'string') el.style.cssText = v;
      else for(const sk in v) el.style[sk] = v[sk];
    } else if(k === 'class'){ el.className = v; }
    else if(k === 'hover'){
      el.addEventListener('mouseenter', ()=>{ for(const sk in v) el.style[sk] = v[sk]; });
      el.addEventListener('mouseleave', ()=>{ for(const sk in v) el.style[sk] = ''; el._reapply && el._reapply(); });
      el._reapply = ()=>{ if(attrs.style && typeof attrs.style === 'object') for(const sk in attrs.style) el.style[sk] = attrs.style[sk]; };
    }
    else if(k === 'onClick') el.addEventListener('click', v);
    else if(k === 'onInput') el.addEventListener('input', v);
    else if(k === 'onScroll') el.addEventListener('scroll', v);
    else if(k === 'ref') v(el);
    else if(k === 'value') el.value = v;
    else if(k === 'disabled'){ if(v) el.setAttribute('disabled',''); }
    else if(k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  const add = (c)=>{
    if(c == null || c === false) return;
    if(Array.isArray(c)){ c.forEach(add); return; }
    el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
  };
  children.forEach(add);
  return el;
}

const App = {
  // Hour width is fitted to the viewport after each render (see fitTimeline):
  // the whole 24h day should sit in one view, scrolling only below MIN_HW.
  HOUR_W: 44,
  BIZ_TABLE_W: 330,   // Business: fixed width of the single planning table (3 columns)
  MIN_HW: 28,   /* 7px per 15-min step — the floor where the grid still reads */
  MAX_HW: 64,
  /* A slot narrower than this can't hold "Slot N" + its range + its type without
     dropping or wrapping them. When the day contains one, we widen the hour column
     past the fit-all-24h width and let the timeline scroll instead — space is
     cheaper than squeezed labels. */
  SLOT_MIN_PX: 88,
  MAX_HW_SCROLL: 150,   /* ceiling once we allow scrolling, so one 15-min slot
                           can't stretch the day to an unusable width */
  barH: 44, subH: 28, modelH: 38, collapsedH: 56,
  state: {
    view: 'people',
    dateRel: 0,
    dailyPivot: 'yc',     // 'yc' = rows are YCs (date rail) | 'weekday' = rows are dates (YC picker)
    dailyYc: null,        // selected YC when dailyPivot === 'weekday'
    dailyBizYc: null,     // selected YC in Business view (rows = companies for that YC)
    expanded: { hsr: true, amazon: true, d0: true },
    // planning templates (#2) — per-weekday template values for one YC (no time axis)
    tYc: null,
    tExpanded: { mon: true }, tEdits: {}, tDirty: false, tPublished: false,
    // per-cell snapshots for day-to-day: what Save committed, what Publish made
    // live. The live value in a field is edits[key]; these two say how it differs.
    savedVals: {}, pubVals: {},
    // publish dialogue: 'now' publishes immediately, 'schedule' queues a batch.
    // `schedule` is the single pending queue — one date/time, many additions.
    pubOpen: false, pubChoice: 'now', pubDate: '', pubTime: '',
    schedule: null,
    // reducing an already-committed number has to be justified
    reduceOpen: false, reduceKey: null, reduceFrom: null, reduceTo: null,
    reduceChoice: null, reduceText: '',
    reduceReasons: {},   // key -> { from, to, reason }
    // header filter row
    filtersOpen: false, filterOpenId: null,
    filters: null, draftFilters: null,   // applied vs. in-progress; seeded on first build
    edits: {},
    cityOpen: false,
    published: false,
    panelOpen: false,     // side panel (Cap. avail. + Rollovers) closed by default
    section: 'daily',     // which app section is open (nav)
    navOpen: true,        // section nav: persistent push sidebar, open by default
    day: 'mon',           // slot-creation weekday
    slotPivot: 'weekday', // 'yc' = rows are YCs (weekday tabs) | 'weekday' = rows are days (YC picker)
    slotYc: 'hsr',        // selected YC when pivot === 'weekday'
    pivotOpen: false,
    ycOpen: false,
    slotEdits: {},        // key `day|ycId` -> [{start,end,planned}]
    slotDirty: false,
    slotPublished: false,
    slotSel: null,        // (dormant) selected boundary — panel dropped for single edits
    typeMode: false,      // 'Define slot type' mode: slots become individually selectable
    typeSel: {},          // key `day|ycId|slotIdx` -> true, while typeMode is on
    typePick: null,       // 'planned' | 'blocked' — the type staged for Update
    slotEdit: false,      // 'Create slots' mode: slicing/resizing on. Off = view only.
                          // While on, ticking rows makes one cut apply to all of them.
    bulkSel: {},          // selected row keys `rday|ycId` -> true
    bulkAt: 12,           // pending cut time for the bulk bar
    bulkResult: null,     // { applied, skipped, at }
  },
  _scrollEl: null,
  _rulerEl: null,
  _panelBtn: null,
  _navBtn: null,
  _rootEl: null,
  _now: 0,
  _pt: null,
  _mounted: false,

  pad(n){ return String(n).padStart(2,'0'); },

  setState(patch){
    if(typeof patch === 'function') patch = patch(this.state);
    Object.assign(this.state, patch);
    this.render();
  },

  // Toggle the side panel WITHOUT a re-render, so it animates and nothing
  // else on the page moves — only the timeline width, the button, the panel.
  togglePanel(){
    this.state.panelOpen = !this.state.panelOpen;
    if(this._rootEl) this._rootEl.classList.toggle('panel-open', this.state.panelOpen);
    this.refitAfterTransition();
    if(this._panelBtn){
      this._panelBtn.classList.toggle('active', this.state.panelOpen);
      this._panelBtn.setAttribute('aria-pressed', String(this.state.panelOpen));
    }
  },

  // Section nav drawer — open/close animates without a re-render.
  toggleNav(open){
    this.state.navOpen = (open===undefined) ? !this.state.navOpen : open;
    if(this._rootEl) this._rootEl.classList.toggle('nav-open', this.state.navOpen);
    this.refitAfterTransition();
    if(this._navBtn){
      this._navBtn.classList.toggle('active', this.state.navOpen);
      this._navBtn.setAttribute('aria-expanded', String(this.state.navOpen));
    }
  },
  selectSection(id){
    // navigate but leave the sidebar in whatever open/closed state the user chose for this session
    if(id !== this.state.section) this.setState({ section: id });
  },

  // Holiday is hidden for now behind this flag. Flip to true to bring back the
  // Holiday tab (Slot creation), the Holiday row (Slot creation day-pivot +
  // Planning templates) and the holiday wording in the nav. Nothing was deleted.
  SHOW_HOLIDAY: false,

  // the four app sections (day-to-day planning is the one built)
  SECTIONS: [
    {id:'slots',     label:'Slot creation',       sub:'Define slots in operating hours', icon:'slots'},

  // aggregate model rows for the collapsed-YC summary row
  aggCap(models){ return models.reduce((s,mo)=> s + mo.cap, 0); },
  aggRoll(models){
    let attac=0,total=0,split=[0,0,0];
    models.forEach(mo=>{ attac+=mo.roll.attac; total+=mo.roll.total; mo.roll.split.forEach((x,i)=> split[i]+=x); });
    return {attac,total,split};
  },

  slotStatus(slot, rel){
    if(rel < 0) return 'past';
    if(rel > 0) return 'future';
    if(slot[2] <= this._now) return 'past';
    if(slot[1] <= this._now && this._now < slot[2]) return 'live';
    return 'future';
  },

  nowHour(){ const d = new Date(); return d.getHours() + d.getMinutes()/60 + d.getSeconds()/3600; },

  scrollToNow(){
    const el = this._scrollEl; if(!el) return;
    const x = Math.max(0, this.nowHour()*this.HOUR_W - 150);
    el.scrollLeft = x;
    if(this._rulerEl) this._rulerEl.scrollLeft = x;
  },

  onPublish(){
    this.setState({ edits: {}, published: true });
    clearTimeout(this._pt);
    this._pt = setTimeout(()=> this.setState({ published: false }), 1800);
  },

  // ---- side panel: one card per YC (Cap. avail. + Rollovers) ----
  // Columns: cap(60) | attac/total(72) | split(86) = 218 inside a 220 card.
  panelCard(yc, rel, expanded){
    const muted = 'color-mix(in srgb, var(--color-text) 65%, transparent)';
    const showRoll = rel <= 0;         // rollovers are end-of-day actuals: today + past
    const dash = { color:'color-mix(in srgb, var(--color-text) 32%, transparent)' };
    const cardStyle = { marginBottom:'24px', border:'1px solid var(--color-divider)', borderRadius:'8px',
      overflow:'hidden', background:'var(--color-surface)', boxShadow:'0 1px 2px rgba(0,0,0,.05)' };
    const col3 = '86px';   // attached/total moved to the left rail

    if(!expanded){
      // one aggregated row, aligned to the 56px collapsed header
      const r = this.aggRoll(yc.models);
      return h('div',{ style: cardStyle },
        h('div',{ style:{ height:this.collapsedH+'px', display:'flex', alignItems:'center',
          fontSize:'13px', fontVariantNumeric:'tabular-nums' } },
          h('div',{ style:{ width:col3, flex:'none', textAlign:'center' } },
            showRoll ? r.split.join(' | ') : h('span',{style:dash},'—'))
        )
      );
    }

    // expanded: Rollovers only — capacity now lives in the left rail
    return h('div',{ style: cardStyle },
      // group title — aligns with the slot-bar band
      h('div',{ style:{ height:this.barH+'px', display:'flex', alignItems:'center',
        background:'var(--color-neutral-900)', borderBottom:'1px solid var(--color-divider)' } },
        h('div',{ style:{ flex:'1', textAlign:'center', fontSize:'10px', fontWeight:'500', letterSpacing:'.02em',
          color:muted } }, 'Rollovers')
      ),
      // sub-headers (28px) — aligns with the Planned/Booked/Attached row
      h('div',{ style:{ height:this.subH+'px', display:'flex', alignItems:'center',
        borderBottom:'1px solid var(--color-divider)' } },
        h('div',{ style:{ width:col3, flex:'none', textAlign:'center', fontSize:'10px', color:muted } }, 'D‑1 | D‑2 | D‑3')
      ),
      // per-model rows (38px each)
      yc.models.map((mod,mi)=>
        h('div',{ style:{ height:this.modelH+'px', display:'flex', alignItems:'center', fontSize:'13px',
          fontVariantNumeric:'tabular-nums',
          borderBottom: mi<yc.models.length-1 ? '1px solid var(--color-divider)':'none' } },
          h('div',{ style:{ width:col3, flex:'none', textAlign:'center' } },
            showRoll ? mod.roll.split.join(' | ') : h('span',{style:dash},'—'))
        )
      )
    );
  },

  // ---- build the whole tree ----
  build(){
    const st = this.state;
    // non-daily sections are placeholders for now
    if(st.section !== 'daily'){
      if(st.section === 'slots') return this.buildSlots();
      if(st.section === 'templates') return this.buildTemplates();
      const sec = this.SECTIONS.find(s=> s.id===st.section) || this.SECTIONS[2];
      return h('div',{ class:'app-root'+(st.navOpen?' nav-open':''), ref:(el)=>{ this._rootEl = el; },
        style:{ minHeight:'100vh', background:'var(--color-bg)', color:'var(--color-text)', fontSize:'14px' } },
        this.buildNav(), this.placeholder(sec));
    }
    return this.buildDaily();
  },

  TPL_P:   { view:'tView', dateRel:'tDateRel', pivot:'tPivot',     yc:'tYc',     expanded:'tExpanded', edits:'tEdits', published:'tPublished' },

  publishTemplate(){
    this.setState({ tDirty:false, tPublished:true });
    clearTimeout(this._pt);
    this._pt = setTimeout(()=> this.setState({ tPublished:false }), 1800);
  },

  buildTemplates(){
    const st = this.state, HW = this.HOUR_W;
    const muted='color-mix(in srgb, var(--color-text) 55%, transparent)', accent='var(--color-accent)';
    this._scrollEl = null; this._rulerEl = null; this._panelBtn = null;
    const selYc = this.SLOT_YC.find(y=> y.id===st.tYc) || this.SLOT_YC[0];
    const trackW = 24*HW+16, gap = 24;
    this._activeEdits = 'tEdits';

    // ---- header: YC picker only (no pivot switch, no date rail) ----
    const ycDd = this.scDropdown({ label: selYc.name, open: st.ycOpen, minWidth:200,
      toggle: ()=> this.setState(ss=>({ ycOpen:!ss.ycOpen, cityOpen:false })),
      items: this.SLOT_YC.map(y=>({ label:y.name, active:y.id===selYc.id, onClick: ()=> this.setState({tYc:y.id, ycOpen:false}) })) });
    const pubBtn = h('button',{ class:'btn btn-primary'+(st.tDirty?' btn-solid':''), disabled: !st.tDirty,
      onClick: ()=> this.publishTemplate(), style:{ fontSize:'14px' } }, 'Update templates');
    const pubLbl = h('span',{ style:{ position:'absolute', top:'100%', right:'0', marginTop:'4px',
      whiteSpace:'nowrap', fontSize:'12px', color:accent, pointerEvents:'none', opacity: st.tPublished?'1':'0' } }, 'Templates updated ✓');
    const topRow = h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'16px', padding:'12px 20px',
      background:'var(--color-bg)', borderBottom:'1px solid var(--color-divider)' } },
      this.makeMenuBtn(),
      h('div',{ style:{ margin:'0 auto' } }, this.labeledCtl('Select centre', ycDd)),
      h('div',{ style:{ display:'flex', alignItems:'center', gap:'8px' } },
        h('div',{ style:{ position:'relative', display:'flex', alignItems:'flex-end' } }, pubBtn, pubLbl)));

    // ---- ruler (00–24, NO current-time marker) ----
    const hourEls=[];
    for(let i=0;i<=24;i++) hourEls.push(h('div',{ style:{ position:'absolute', left:(i*HW)+'px', top:'0', height:'32px',
      borderLeft:'1px solid var(--color-divider)', paddingLeft:'3px', fontSize:(HW<40?'10px':'12px'), color:muted,
      display:'flex', alignItems:'flex-end', paddingBottom:'3px' } }, (HW<36 && i%2) ? '' : this.pad(i)));
    const rulerRow = h('div',{ style:{ display:'flex', alignItems:'flex-start', padding:'14px 16px 10px',
      borderBottom:'1px solid var(--color-divider)', background:'var(--color-bg)' } },
      h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)', height:'32px', display:'flex',
        alignItems:'flex-end', paddingBottom:'2px', fontSize:'14px', fontWeight:'500' } }, 'Time of the day:'),
      h('div',{ class:'tl-ruler', ref:(el)=>{this._rulerEl=el;}, style:{ flex:'1 1 auto', minWidth:'0', overflow:'hidden', margin:'0 10px' } },
        h('div',{ style:{ position:'relative', width:trackW+'px', height:'32px' } }, hourEls)));
    const topBar = h('div',{ style:{ position:'sticky', top:'0', zIndex:'30', background:'var(--color-bg)' } }, topRow, rulerRow);

    // ---- rows: Mon–Sun + Holiday, one YC, slots positioned by time, empty template inputs ----
    const rowDefs = this.TPL_DAYS.map(([k,l])=>({day:k, label:l}))
      .concat(this.SHOW_HOLIDAY ? [{day:'hol', label:'Holiday'}] : []);
    this.noteMinSlot(rowDefs.reduce((acc,rd)=>{
      const closed = (rd.day==='hol') || selYc.closed.indexOf(rd.day)!==-1;
      return closed ? acc : acc.concat(this.getSlots(rd.day, selYc).map(sl=> sl.end - sl.start));
    }, []));
    const MODELS = this.TPL_MODELS;
    const leftCards=[], midBlocks=[];
    rowDefs.forEach((rd,i)=>{
      const isLast = i===rowDefs.length-1;
      const closed = (rd.day==='hol') || selYc.closed.indexOf(rd.day)!==-1;
      const expanded = !closed && !!st.tExpanded[rd.day];
      const slots = closed ? [] : this.getSlots(rd.day, selYc);
      // The slot band keeps one height in both states: expanding only appends rows
      // below, so nothing already on screen moves.
      const headerH = this.collapsedH;
      const barBandH = this.collapsedH;
      const barTop = 10;

      // left card — the whole header toggles; the arrow is just an affordance
      const sub = closed ? (rd.day==='hol'?'No operating hours':'Closed') : (slots.length+' slot'+(slots.length!==1?'s':''));
      const toggle = closed ? null : ()=> this.setState(ss=>({ tExpanded: Object.assign({}, ss.tExpanded, {[rd.day]: !ss.tExpanded[rd.day]}) }));
      leftCards.push(h('div',{ style:{ marginBottom:gap+'px', border:'1px solid var(--color-divider)', borderRadius:'8px',
        overflow:'hidden', background:'var(--color-surface)', boxShadow:'0 1px 2px rgba(0,0,0,.05)', opacity: closed?'.65':'1' } },
        h('div',{ onClick: toggle, hover: closed?null:{ background:'var(--color-neutral-200)' },
          style:{ height:headerH+'px', display:'flex', alignItems:'center', gap:'10px', padding:'0 12px',
            background:'var(--color-neutral-900)', cursor: closed?'default':'pointer', userSelect:'none' } },
          closed ? null : this.iconEl(expanded?'arrowUp':'arrowDown', 'var(--color-text-2)'),
          h('div',{ style:{ flex:'1', minWidth:'0', display:'flex', flexDirection:'column', gap:'1px' } },
            h('div',{ style:{ fontWeight:'500' } }, rd.label),
            h('div',{ style:{ fontSize:'11px', color:muted } }, sub))),
        // spacer matching the column-header band on the right, so model labels line up
        expanded ? h('div',{ style:{ height:this.subH+'px', borderTop:'1px solid var(--color-divider)',
          background:'var(--color-neutral-900)' } }) : null,
        expanded ? MODELS.map(([mk,ml])=> h('div',{ style:{ height:this.modelH+'px', display:'flex', alignItems:'center',
          fontSize:'14px', borderTop:'1px solid var(--color-divider)' } }, h('span',{ style:{ flex:'1', paddingLeft:'30px' } }, ml))) : null
      ));

      // middle band — light secondary-surface header (weight from a defined border, not a heavy fill)
      const slotBars = slots.map((sl,si)=>{
        const w=(sl.end-sl.start)*HW;
        return h('div',{
          title: sl.blocked ? 'Blocked — this slot is not planned' : null,
          style:{ position:'absolute', left:(sl.start*HW)+'px', width:w+'px', top:barTop+'px', height:'36px',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', lineHeight:'1.05',
            background: sl.blocked ? 'repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 6%,transparent) 0 6px, transparent 6px 12px), var(--color-surface)' : 'var(--color-neutral-900)',
            color:'var(--color-text)', border:'1px solid var(--color-neutral-600)',
            borderRadius:'6px', cursor:'pointer' } },
          h('span',{ style:{ fontWeight:'700', fontSize:'13px' } }, 'Slot '+(si+1)),
          w>60 ? h('span',{ style:{ fontSize:'11px', color:'var(--color-text-2)' } }, this.hhmm(sl.start)+'–'+this.hhmm(sl.end)) : null);
      });
      const bandChildren = [ h('div',{ onClick: toggle, hover: closed?null:{ background:'color-mix(in srgb, var(--color-text) 4%, transparent)' },
        style:{ position:'relative', height:barBandH+'px', cursor: closed?'default':'pointer' } },
        this.hatchGaps(slots.map(sl=>[sl.start, sl.end])), slotBars) ];
      if(expanded){
        // column header band — a single "Planned" label per slot (matches day-to-day)
        const subCells = slots.map(sl=> sl.blocked ? null : h('div',{ style:{ position:'absolute', left:(sl.start*HW)+'px',
          width:((sl.end-sl.start)*HW)+'px', top:'0', height:this.subH+'px', display:'flex', alignItems:'center',
          justifyContent:'center', border:'1px solid var(--color-divider)', borderBottom:'none',
          borderTopLeftRadius:'5px', borderTopRightRadius:'5px', background:'var(--color-neutral-900)',
          fontSize:'11px', letterSpacing:'.02em', color:'color-mix(in srgb, var(--color-text) 65%, transparent)' } }, 'Planned'));
        bandChildren.push(h('div',{ style:{ position:'relative', height:this.subH+'px' } }, subCells));
        MODELS.forEach(([mk,ml],mi)=>{
          const lastRow = mi===MODELS.length-1;
          const cells = slots.map(sl=>{
            if(sl.blocked) return null;  // Blocked: no template value for this slot
            const key='tpl|'+selYc.id+'|'+rd.day+'|'+sl.start+'|'+mk;
            const cur = st.tEdits[key]!==undefined ? st.tEdits[key] : '';
            const inp=h('input',{ class:'plan'+(cur===''?' tpl-empty':''), type:'text', inputmode:'numeric', placeholder:'—', value: cur });
            inp.addEventListener('input',(e)=>{ const val=e.target.value.replace(/[^0-9]/g,'').slice(0,4); e.target.value=val;
              if(val==='') delete this.state.tEdits[key]; else this.state.tEdits[key]=val;
              e.target.classList.toggle('tpl-empty', val==='');
              this.state.tDirty=true; this.persist();
              if(this._publishBtn){ this._publishBtn.toggleAttribute('disabled', false); this._publishBtn.classList.add('btn-solid'); } });
            return h('div',{ style:{ position:'absolute', left:(sl.start*HW)+'px', width:((sl.end-sl.start)*HW)+'px',
              top:'0', height:this.modelH+'px', display:'flex', alignItems:'center', justifyContent:'center',
              borderLeft:'1px solid var(--color-divider)', borderRight:'1px solid var(--color-divider)',
              borderBottom:'1px solid var(--color-divider)',
              borderBottomLeftRadius:lastRow?'5px':'0', borderBottomRightRadius:lastRow?'5px':'0',
              background:'var(--color-surface)' } }, inp);
          });
          bandChildren.push(h('div',{ style:{ position:'relative', height:this.modelH+'px' } }, cells));
        });
      }
      midBlocks.push(h('div',{ style:{ marginBottom:gap+'px', borderBottom: isLast?'none':'1px solid var(--color-divider)' } }, bandChildren));
    });

    const leftRail = h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)' } },
      h('div',{ style:{ height:'16px' } }), leftCards);
    const middle = h('div',{ class:'tl-scroll', ref:(el)=>{this._scrollEl=el;},
      onScroll:(e)=>{ if(this._rulerEl) this._rulerEl.scrollLeft = e.target.scrollLeft; },
      style:{ flex:'1 1 auto', minWidth:'0', overflowX:'auto', overflowY:'hidden', margin:'0 10px' } },
      h('div',{ style:{ position:'relative', width:trackW+'px',
        backgroundImage:'repeating-linear-gradient(to right, transparent 0, transparent '+(HW-1)+'px, color-mix(in srgb, var(--color-text) 6%, transparent) '+(HW-1)+'px, color-mix(in srgb, var(--color-text) 6%, transparent) '+HW+'px)' } },
        h('div',{ style:{ height:'16px' } }), midBlocks));
    const main = h('div',{ style:{ display:'flex', alignItems:'flex-start', padding:'0 16px 40px' } }, leftRail, middle);

    return h('div',{ class:'app-root'+(st.navOpen?' nav-open':''), ref:(el)=>{ this._rootEl=el; },
      style:{ minHeight:'100vh', background:'var(--color-bg)', color:'var(--color-text)', fontSize:'14px' } },
      this.buildNav(), topBar, main);
  },

  buildPlanner(P){
    this.ensureFilters();
    const HW = this.HOUR_W, st = this.state, rel = st[P.dateRel];
    const now = this.nowHour(); this._now = now;
    const muted = 'color-mix(in srgb, var(--color-text) 55%, transparent)';
    const accent = 'var(--color-accent)';
    const isToday = rel === 0;
    const raw = this.data(st[P.view]);
    const pivot = st[P.pivot];
    const selYc = raw.find(y=> y.id===st[P.yc]) || raw[0];
    const isBiz = st[P.view]==='business';
    const bizYc = this.SLOT_YC.find(y=> y.id===st.dailyBizYc) || this.SLOT_YC[0];
    const showNowMarker = (pivot==='weekday' && !isBiz) ? true : isToday;
    this._activeEdits = P.edits;

    this._scrollEl = null; this._rulerEl = null; this._panelBtn = null;

    // ---- tabs ----
    const mkTab = (id,label)=>{
      const active = st[P.view]===id;
      return h('div', {
        onClick: ()=> this.setState({[P.view]:id}),
        hover: { background:'color-mix(in srgb, var(--color-text) 7%, transparent)' },
        style:{ display:'flex', alignItems:'center', height:'38px', padding:'0 18px', fontSize:'14px', cursor:'pointer', userSelect:'none',
          fontWeight: active?'500':'500',
          background: active? 'color-mix(in srgb, var(--color-accent) 16%, transparent)':'transparent',
          color: active? accent : 'var(--color-text)',
          borderRight: id==='people' ? '1px solid var(--color-divider)':'none' } }, label);
    };
    const tabs = h('div', { style:{ display:'inline-flex', border:'1px solid var(--color-divider)',
      borderRadius:'8px', overflow:'hidden' } }, mkTab('people','People'), mkTab('business','Business'));

    // ---- date rail ----
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const base = new Date();
    const days = [-3,-2,-1,0,1,2,3].map(r=>{ const dt = new Date(base); dt.setDate(base.getDate()+r);
      return { d: dt.getDate(), dow: DOW[dt.getDay()], rel: r }; });
    const dateRail = h('div', { style:{ display:'flex', alignItems:'flex-end', gap:'6px', margin:'0 auto' } },
      days.map(x=>{
        const sel = x.rel===rel, today = x.rel===0, past = x.rel<0;
        return h('div', {
          onClick: ()=> this.setState({[P.dateRel]:x.rel}),
          title: today?'Today (editable)': past?'Past (read-only)':'Future (editable)',
          hover: { borderColor:'var(--color-neutral-600)' },
          style:{ display:'flex', flexDirection:'column', alignItems:'center', gap:'1px',
            minWidth:'46px', height:'38px', justifyContent:'center', padding:'0 8px', borderRadius:'8px', cursor:'pointer',
            border:'1px solid '+(sel? accent : 'transparent'),
            background: sel? 'color-mix(in srgb, var(--color-accent) 14%, transparent)':'transparent',
            opacity: past? '.82' : '1' } },
          h('div',{style:{ fontSize:'10px', letterSpacing:'.04em', textTransform:'uppercase', color: muted }}, x.dow),
          h('div',{style:{ fontSize:'15px', fontWeight: sel?'500':'500', color: sel? accent : 'var(--color-text)' }}, String(x.d)),
          h('div',{style:{ width:'4px', height:'4px', borderRadius:'50%', marginTop:'1px',
            background: today? accent : 'transparent' }})
        );
      })
    );

    // ---- pivot: Yulu centers (rows=YCs, date rail) vs Weekday (rows=dates, YC picker) ----
    const pivotDd = this.scDropdown({ label: pivot==='yc'?'Yulu centers':'Weekday', open: st.pivotOpen, minWidth:150,
      toggle: ()=> this.setState(ss=>({ pivotOpen:!ss.pivotOpen, cityOpen:false, ycOpen:false })),
      items:[
        {label:'Yulu centers', active:pivot==='yc',      onClick:()=>this.setState({[P.pivot]:'yc', pivotOpen:false})},
        {label:'Weekday',      active:pivot==='weekday', onClick:()=>this.setState({[P.pivot]:'weekday', pivotOpen:false})},
      ]});
    const centerSel = pivot==='yc'
      ? dateRail
      : h('div',{ style:{ margin:'0 auto' } }, this.scDropdown({ label: selYc.name, open: st.ycOpen, minWidth:200,
          toggle: ()=> this.setState(ss=>({ ycOpen:!ss.ycOpen, pivotOpen:false, cityOpen:false })),
          items: raw.map(y=>({ label:y.name, active:y.id===selYc.id, onClick:()=>this.setState({[P.yc]:y.id, ycOpen:false}) })) }));

    // ---- Business: dropdown picks the YC; rows become the companies planned there ----
    const bizYcPicker = this.scDropdown({ label: bizYc.name, open: st.ycOpen, minWidth:200,
      toggle: ()=> this.setState(ss=>({ ycOpen:!ss.ycOpen, pivotOpen:false, cityOpen:false })),
      items: this.SLOT_YC.map(y=>({ label:y.name, active:y.id===bizYc.id, onClick:()=>this.setState({dailyBizYc:y.id, ycOpen:false}) })) });
    const headDropdown = isBiz ? bizYcPicker : pivotDd;   // dropdown after the tabs
    const headCenter   = isBiz ? dateRail   : centerSel;  // Business always uses the date rail

    // ---- city dropdown ----
    // ---- save / publish -----------------------------------------------------
    // Day-to-day is two-stage: Save commits the numbers to the platform, Publish
    // pushes them upstream and opens the slots to customers. Save is Secondary so
    // there is still exactly one Primary action on the screen.
    const twoStage = (P === this.DAILY_P);
    const hasEdits = Object.keys(st[P.edits]).length > 0;
    const tally = twoStage ? this.planTally() : null;
    const unsaved  = twoStage ? tally.canSave : hasEdits;
    const canPublish = twoStage ? tally.canPublish : hasEdits;

    const saveBtn = twoStage ? h('button',{ class:'btn btn-primary', ref:(el)=>{ this._saveBtn = el; },
      onClick: ()=> this.savePlanner(P), disabled: !unsaved,
      title: tally.dirtyPublished
        ? 'These slots are already live — publish to apply the change'
        : 'Save these numbers in the platform', style:{ fontSize:'14px' } }, 'Save') : null;

    const publishBtn = h('button',{ class:'btn btn-primary'+(canPublish?' btn-solid':''),
      ref:(el)=>{ this._publishBtn = el; },
      onClick: ()=> twoStage ? this.openPublishDialog() : this.publishPlanner(P),
      disabled: !canPublish, title:'Push the saved numbers upstream and open these slots to customers',
      style:{ fontSize:'14px' } }, 'Publish');

    // a queued schedule stays visible without opening the dialogue
    const schedChip = (twoStage && st.schedule) ? h('button',{ onClick: ()=> this.openPublishDialog(),
      class:'sched-chip', title:'View or change the scheduled publish',
      style:{ border:'none', cursor:'pointer' } },
      h('span',{ class:'dot' }),
      h('span',{}, 'Scheduled · '+this.schedLabel(st.schedule))) : null;

    const statusLabel = st[P.published] ? 'Published ✓' : (st.dailySaved ? 'Saved ✓'
      : (twoStage && tally.dirtyPublished
          ? (tally.dirtyPublished + (tally.dirtyPublished===1?' live slot edited':' live slots edited') + ' — publish to apply')
          : ''));
    const publishedLabel = h('span',{ ref:(el)=>{ this._statusLbl = el; },
      style:{ position:'absolute', top:'100%', right:'0', marginTop:'4px',
      whiteSpace:'nowrap', fontSize:'12px', color:accent, transition:'opacity .2s',
      pointerEvents:'none', opacity: statusLabel?'1':'0' } }, statusLabel || 'Published ✓');

    // Viewing options now uses the segmented treatment the People/Business tabs
    // had, and sits in their old slot. Fleet (in the filter row) took over the
    // People/Business switch.
    const pivotSeg = isBiz ? null : this.segmented([
      { label:'Yulu centers', active: pivot==='yc',      onClick: ()=> this.setState({[P.pivot]:'yc'}) },
      { label:'Weekday',      active: pivot==='weekday', onClick: ()=> this.setState({[P.pivot]:'weekday'}) },
    ]);

    const topRow = h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'16px', padding:'12px 20px',
      background:'var(--color-bg)', borderBottom:'1px solid var(--color-divider)' } },
      this.makeMenuBtn(),
      pivotSeg,
      this.filtersButton(),
      headCenter,
      h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'12px', marginLeft:'auto' } },
        isBiz ? this.labeledCtl('Select centre', headDropdown) : null,
        schedChip ? h('div',{ style:{ display:'flex', alignItems:'center', height:'38px' } }, schedChip) : null,
        saveBtn,
        h('div',{ style:{ position:'relative', display:'flex', alignItems:'flex-end' } }, publishBtn, publishedLabel)
      )
    );

    // ---- side-panel toggle button (top-right; the ref-4 spot) ----
    const panelBtn = h('button',{ class:'panel-toggle'+(st.panelOpen?' active':''),
      ref:(el)=>{ this._panelBtn = el; },
      title:'Rollovers', 'aria-label':'Toggle Rollovers panel',
      'aria-pressed': String(st.panelOpen),
      onClick: ()=> this.togglePanel(),
      html:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none">'
        +'<rect x="1.6" y="2.6" width="14.8" height="12.8" rx="2.2" stroke="currentColor" stroke-width="1.4"/>'
        +'<rect x="10.8" y="3" width="5.4" height="12" fill="currentColor" opacity="0.85"/></svg>' });

    // ---- ruler ----
    const hourEls = [];
    for(let i=0;i<=24;i++){
      hourEls.push(h('div',{ style:{ position:'absolute', left:(i*HW)+'px', top:'0', height:'32px',
        borderLeft:'1px solid var(--color-divider)', paddingLeft:'3px', fontSize:(HW<40?'10px':'12px'), color:muted,
        display:'flex', alignItems:'flex-end', paddingBottom:'3px' } }, (HW<36 && i%2) ? '' : this.pad(i)));
    }
    if(showNowMarker){
      hourEls.push(h('div',{ style:{ position:'absolute', left:(now*HW-7)+'px', bottom:'-2px', width:'0', height:'0',
        borderLeft:'7px solid transparent', borderRight:'7px solid transparent',
        borderTop:'9px solid var(--color-brand)' } }));
    }
    const rulerTrack = h('div',{ style:{ position:'relative', width:(24*HW+16)+'px', height:'32px' } }, hourEls);
    const rulerRow = h('div',{ style:{ position:'relative', display:'flex', alignItems:'flex-start',
      padding:'14px 16px 10px', borderBottom:'1px solid var(--color-divider)', background:'var(--color-bg)' } },
      h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)', height:'32px', display:'flex',
        alignItems:'flex-end', paddingBottom:'2px', fontSize:'14px', fontWeight:'500' } }, 'Time of the day:'),
      h('div',{ class:'tl-ruler', ref:(el)=>{this._rulerEl=el;},
        style:{ flex:'1 1 auto', minWidth:'0', overflow:'hidden', margin:'0 10px' } }, rulerTrack),
      h('div',{ class:'aside-rail', style:{ height:'32px' } }),   // spacer matching the panel width
      panelBtn
    );

    const topBar = h('div',{ style:{ position:'sticky', top:'0', zIndex:'30', background:'var(--color-bg)' } },
      topRow, this.buildFilterWrap(), rulerRow);

    // ---- rows: YCs at one date (yc pivot) OR dates for one YC (weekday pivot) ----
    const statusFill = { past:'var(--color-accent-800)', live:'var(--color-accent)', future:'var(--color-accent-700)' };
    const rowDefs = isBiz
      ? raw.map(co=>({ yc: co, rel: st[P.dateRel], key: co.id,
          titleNode: h('span',{ style:{ flex:'1', fontWeight:'500', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' } }, co.name) }))
      : pivot==='yc'
      ? raw.map(yc=>({ yc, rel: st[P.dateRel], key: yc.id,
          titleNode: h('span',{ style:{ flex:'1', fontWeight:'500', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' } }, yc.name) }))
      : [-3,-2,-1,0,1,2,3].map(r=>{ const dt=new Date(base); dt.setDate(base.getDate()+r); const today=r===0, past=r<0;
          return { yc:selYc, rel:r, key:'d'+r,
            titleNode: h('span',{ style:{ flex:'1', display:'flex', alignItems:'baseline', gap:'7px', whiteSpace:'nowrap', overflow:'hidden' } },
              h('span',{ style:{ fontWeight:'500', color: today?accent:'var(--color-text)' } }, DOW[dt.getDay()]+' '+dt.getDate()),
              h('span',{ style:{ fontSize:'11px', color: today?accent:muted } }, today?'Today':(past?'Past':'Future'))) }; });

    const leftCards = [], midBlocks = [], panelCards = [];
    const _slotSpans = [];

    rowDefs.forEach((rd,ycIdx)=>{
      const yc = rd.yc, rel = rd.rel, rowKey = rd.key;
      // Business: one slot per company = the selected YC's operating hours.
      // People: slots come from Slot creation (shared truth), by the date's weekday.
      let slots, bizSpan = null;
      if(isBiz){
        // The bar spans the whole operating window (breaks drawn inside it), but the
        // single table below no longer stretches to match — it sits compact at the
        // start of the window, wide enough for its three columns and no wider.
        bizSpan = [bizYc.op[0], bizYc.op[1]];
        const tblEnd = Math.min(bizYc.op[1], bizYc.op[0] + this.BIZ_TABLE_W / HW);
        slots = [[1, bizYc.op[0], tblEnd]];
      } else {
        const _scy = this.SLOT_YC.find(y=> y.id===yc.id);
        if(_scy){ const wk = this.wkKeyForRel(rel);
          slots = (_scy.closed.indexOf(wk)!==-1) ? [] : this.getSlots(wk, _scy).map((s,idx)=>[idx+1, s.start, s.end, !!s.blocked]); }
        else { slots = yc.slots; }
      }
      (slots||[]).forEach(s=> _slotSpans.push(s[2]-s[1]));
      const isLast = ycIdx === rowDefs.length-1;
      const expanded = !!st[P.expanded][rowKey];
      // constant band height — expanding appends rows below instead of resizing this one
      const barBandH = this.collapsedH;
      const barTop = 10;
      const onToggle = ()=> this.setState(ss=>({ [P.expanded]: Object.assign({}, ss[P.expanded], {[rowKey]: !ss[P.expanded][rowKey]}) }));

      // ===== LEFT rail card (name + model labels + available capacity) =====
      const CAP_W = '58px', ATT_W = '62px';
      const capMuted = 'color-mix(in srgb, var(--color-text) 65%, transparent)';
      // attached/total sits with capacity, where it can be read against it;
      // the D-1|D-2|D-3 split stays in the Rollovers panel
      const rollShow = rel <= 0;   // end-of-day actuals: today and past only
      const attDash = h('span',{ style:{ color:'color-mix(in srgb, var(--color-text) 32%, transparent)' } }, '—');
      // column headers, revealed with the accordion, sitting on the band that
      // lines up with Planned/Booked/Attached on the right
      const subSpacer = expanded ? h('div',{ style:{ height:this.subH+'px', display:'flex', alignItems:'center',
        borderTop:'1px solid var(--color-divider)', background:'var(--color-neutral-900)',
        fontSize:'10px', fontWeight:'500', letterSpacing:'.02em', color:capMuted } },
        h('div',{ style:{ flex:'1', minWidth:'0', paddingLeft:'16px' } }, 'Bike models'),
        h('div',{ style:{ width:CAP_W, flex:'none', textAlign:'center',
          borderLeft:'1px solid var(--color-divider)' } }, 'Cap. avail.'),
        h('div',{ style:{ width:ATT_W, flex:'none', textAlign:'center',
          borderLeft:'1px solid var(--color-divider)' } }, 'Attac. / tot')
      ) : null;
      const modelLabelRows = expanded ? yc.models.map((mod)=>
        h('div',{ hover:{ background:'color-mix(in srgb, var(--color-text) 4%, transparent)' },
          style:{ height:this.modelH+'px', display:'flex', alignItems:'center', fontSize:'14px',
            borderTop:'1px solid var(--color-divider)' } },
          h('span',{ style:{ flex:'1', minWidth:'0', paddingLeft:'16px', whiteSpace:'nowrap',
            overflow:'hidden', textOverflow:'ellipsis' } }, mod.label),
          h('span',{ style:{ width:CAP_W, flex:'none', textAlign:'center', fontSize:'13px',
            fontVariantNumeric:'tabular-nums', borderLeft:'1px solid var(--color-divider)',
            alignSelf:'stretch', display:'flex', alignItems:'center', justifyContent:'center' } }, String(mod.cap)),
          h('span',{ style:{ width:ATT_W, flex:'none', textAlign:'center', fontSize:'13px',
            fontVariantNumeric:'tabular-nums', borderLeft:'1px solid var(--color-divider)',
            alignSelf:'stretch', display:'flex', alignItems:'center', justifyContent:'center' } },
            (rollShow && mod.roll) ? (mod.roll.attac+' / '+mod.roll.total) : attDash.cloneNode(true))
        )
      ) : null;

      leftCards.push(h('div',{ style:{ marginBottom:'24px', border:'1px solid var(--color-divider)',
        borderRadius:'8px', overflow:'hidden', background:'var(--color-surface)', boxShadow:'0 1px 2px rgba(0,0,0,.05)' } },
        h('div',{ onClick:onToggle, hover:{ background:'var(--color-neutral-200)' },
          style:{ height:this.collapsedH+'px', display:'flex',
          alignItems:'center', gap:'10px', padding:'0 12px', background:'var(--color-neutral-900)',
          cursor:'pointer', userSelect:'none' } },
          this.iconEl(expanded?'arrowUp':'arrowDown', 'var(--color-text-2)'),
          rd.titleNode
        ),
        subSpacer,
        modelLabelRows
      ));

      // ===== MIDDLE band =====
      // All slots share one look; the vertical "now" line marks the current slot,
      // and only the input fields carry the past/future (read-only/editable) distinction.
      const slotBars = (bizSpan ? [[1, bizSpan[0], bizSpan[1]]] : slots).map(s=>{
        const w = (s[2]-s[1])*HW;
        return h('div',{
          title: s[3] ? 'Blocked — this slot is not planned' : null,
          style:{ position:'absolute', left:(s[1]*HW)+'px', width:w+'px',
            top:barTop+'px', height:'36px',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', lineHeight:'1.05',
            background: s[3] ? 'repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 6%,transparent) 0 6px, transparent 6px 12px), var(--color-surface)' : 'var(--color-neutral-900)',
            color:'var(--color-text)', border:'1px solid var(--color-neutral-600)',
            borderRadius:'6px', cursor:'pointer' } },
          h('span',{ style:{ fontWeight:'700', fontSize:'13px' } }, isBiz ? 'Operating hours' : 'Slot '+s[0]),
          w>60 ? h('span',{ style:{ fontSize:'11px', color:'var(--color-text-2)' } }, this.hhmm(s[1])+'–'+this.hhmm(s[2])) : null
        );
      });

      // breaks sit on top of the operating bar, so the pause inside the window reads
      // the same way it does in Slot creation
      const bizBreaks = bizSpan ? (bizYc.breaks||[]).map(br=>
        h('div',{ class:'sc-break', title:'Break '+this.hhmm(br[0])+'–'+this.hhmm(br[1]),
          style:{ position:'absolute', left:(br[0]*HW)+'px', width:((br[1]-br[0])*HW)+'px',
            top:(barTop+1)+'px', height:'34px', display:'flex',
            // an opaque base under the hatch so the pause cuts the bar instead of
            // tinting it, with hairlines marking where the window resumes
            background:'repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 10%,transparent) 0 5px, color-mix(in srgb,var(--color-text) 3%,transparent) 5px 10px), var(--color-surface)',
            borderLeft:'1px solid var(--color-neutral-600)', borderRight:'1px solid var(--color-neutral-600)',
            alignItems:'center', justifyContent:'center' } },
          (br[1]-br[0])*HW>52 ? h('span',{ style:{ fontSize:'10px', color:'var(--color-text-2)' } }, 'Break') : null)) : [];
      const bandChildren = [ h('div',{ onClick:onToggle, hover:{ background:'color-mix(in srgb, var(--color-text) 4%, transparent)' },
        style:{ position:'relative', height:barBandH+'px', cursor:'pointer' } },
        this.hatchGaps(bizSpan ? [bizSpan] : slots.map(s=>[s[1], s[2]])), slotBars, bizBreaks) ];

      if(expanded){
        const subCells = slots.map(s=>{
          if(s[3]) return null;          // Blocked: no planning table under this slot
          const status = this.slotStatus(s, rel);
          const attMute = status==='future';
          return h('div',{ style:{ position:'absolute', left:(s[1]*HW)+'px', width:((s[2]-s[1])*HW)+'px',
            top:'0', height:this.subH+'px', display:'flex', border:'1px solid var(--color-divider)',
            borderBottom:'none', borderTopLeftRadius:'5px', borderTopRightRadius:'5px', background:'var(--color-neutral-900)' } },
            h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px',
              letterSpacing:'.02em', color:'color-mix(in srgb, var(--color-text) 65%, transparent)' } }, 'Planned'),
            h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px',
              letterSpacing:'.02em', borderLeft:'1px solid var(--color-divider)',
              color:'color-mix(in srgb, var(--color-text) 65%, transparent)' } }, 'Booked'),
            h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px',
              letterSpacing:'.02em', borderLeft:'1px solid var(--color-divider)',
              color: attMute ? 'color-mix(in srgb, var(--color-text) 32%, transparent)' : 'color-mix(in srgb, var(--color-text) 65%, transparent)' } }, 'Attached')
          );
        });
        bandChildren.push(h('div',{ style:{ position:'relative', height:'28px' } }, subCells));

        yc.models.forEach((mod,mi)=>{
          const lastRow = mi === yc.models.length-1;
          const cells = slots.map(s=>{
            if(s[3]) return null;        // Blocked: nothing to enter for this slot
            const status = this.slotStatus(s, rel);
            const editable = status==='future';
            const v = mod.vals[s[0]] || [0,0,0];
            const key = st[P.view]+'|'+rel+'|'+yc.id+'|'+mod.key+'|'+s[0];
            // today and tomorrow carry planned numbers; D+2 onward is still open for planning
            const unplanned = rel >= 2;
            const planned = editable
              ? (st[P.edits][key] !== undefined ? st[P.edits][key]
                 : (st.pubVals[key] !== undefined ? st.pubVals[key]
                    : (st.savedVals[key] !== undefined ? st.savedVals[key]
                       : (unplanned ? '' : String(v[0])))))
              : String(v[0]);
            const attShow = status!=='future';

            let plannedNode;
            if(editable){
              const cellState = twoStage ? this.planCellState(key, planned)
                                         : (planned===''?'empty':'draft');
              const tplVal = twoStage ? this.tplValueFor(yc.id, rel, s[1], mod.key) : '';
              const inp = h('input',{ class:'plan'+(twoStage?this.planCellClass(cellState):(planned===''?' is-helper':'')),
                type:'text', inputmode:'numeric',
                // the template number sits in the field as helper text until a
                // value is entered, per the reference
                placeholder: (twoStage && tplVal!=='') ? tplVal : '—', value: planned });
              const dot = twoStage
                ? h('span',{ class:'plan-dot '+this.planDotClass(cellState) })
                : null;
              const restyle = (val)=>{
                if(!twoStage){ inp.classList.toggle('is-helper', val===''); return; }
                const stNow = this.planCellState(key, val);
                inp.className = 'plan' + this.planCellClass(stNow);
                if(dot) dot.className = 'plan-dot ' + this.planDotClass(stNow);
              };
              // the template number is offered as helper text once the field has
              // focus; → accepts it, so a planner can walk the row with one hand
              if(tplVal !== ''){
                inp.addEventListener('keydown', (e)=>{
                  if(e.key !== 'ArrowRight' || inp.value !== '') return;
                  e.preventDefault();
                  inp.value = tplVal;
                  this.state[P.edits] = Object.assign({}, this.state[P.edits], {[key]: tplVal});
                  restyle(tplVal);
                  this._refreshPublish();
                });
              }
              inp.addEventListener('input', (e)=>{
                const val = e.target.value.replace(/[^0-9]/g,'').slice(0,4);
                e.target.value = val;
                this.state[P.edits] = Object.assign({}, this.state[P.edits], {[key]: val});
                restyle(val);
                this._refreshPublish();
              });
              // leaving the field with a number below the last committed one asks why
              if(twoStage) inp.addEventListener('blur', ()=> this.checkReduction(key, inp.value));
              plannedNode = dot
                ? h('div',{ class:'plan-cell' }, dot, inp)
                : h('div',{ class:'plan-cell' }, inp);
            } else {
              plannedNode = h('span',{}, planned);
            }

            return h('div',{ style:{ position:'absolute', left:(s[1]*HW)+'px', width:((s[2]-s[1])*HW)+'px',
              top:'0', height:this.modelH+'px', display:'flex', fontSize:'14px',
              borderLeft:'1px solid var(--color-divider)', borderRight:'1px solid var(--color-divider)',
              borderBottom:'1px solid var(--color-divider)',
              borderBottomLeftRadius: lastRow?'5px':'0', borderBottomRightRadius: lastRow?'5px':'0',
              background:'var(--color-surface)' } },
              h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', height:'100%' } }, plannedNode),
              h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', height:'100%',
                borderLeft:'1px solid var(--color-divider)' } }, String(v[1])),
              h('div',{ style:{ flex:'1', display:'flex', alignItems:'center', justifyContent:'center', height:'100%',
                borderLeft:'1px solid var(--color-divider)' } },
                h('span',{ style: attShow ? {} : { color:'color-mix(in srgb, var(--color-text) 32%, transparent)' } },
                  attShow ? String(v[2]) : '–'))
            );
          });
          bandChildren.push(h('div',{ style:{ position:'relative', height:'38px' } }, cells));
        });
      }

      midBlocks.push(h('div',{ style:{ marginBottom:'24px',
        borderBottom: isLast ? 'none' : '1px solid var(--color-divider)' } }, bandChildren));

      // ===== side PANEL card =====
      panelCards.push(this.panelCard(yc, rel, expanded));
    });

    // ---- main columns ----
    this.noteMinSlot(_slotSpans);
    const leftRail = h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)' } },
      h('div',{ style:{ height:'16px' } }), leftCards);

    const middle = h('div',{ class:'tl-scroll', ref:(el)=>{this._scrollEl=el;},
      onScroll:(e)=>{ if(this._rulerEl) this._rulerEl.scrollLeft = e.target.scrollLeft; },
      style:{ flex:'1 1 auto', minWidth:'0', overflowX:'auto', overflowY:'hidden', margin:'0 10px' } },
      h('div',{ style:{ position:'relative', width:(24*HW+16)+'px',
        backgroundImage:'repeating-linear-gradient(to right, transparent 0, transparent '+(HW-1)+'px, color-mix(in srgb, var(--color-text) 6%, transparent) '+(HW-1)+'px, color-mix(in srgb, var(--color-text) 6%, transparent) '+HW+'px)' } },
        // vertical "now" playhead running down from the top arrow — its overlap marks the current slot(s)
        showNowMarker ? h('div',{ style:{ position:'absolute', left:(now*HW)+'px', top:'0', bottom:'0', width:'2px',
          marginLeft:'-1px', background:'var(--color-brand)', zIndex:'4', pointerEvents:'none' } }) : null,
        h('div',{ style:{ height:'16px' } }), midBlocks)
    );

    const panel = h('div',{ class:'aside-rail' },
      h('div',{ style:{ width:'var(--panel-w)' } },
        h('div',{ style:{ height:'16px' } }), panelCards)
    );

    // the legend footer is fixed to the viewport, so the rows need room to clear it
    const main = h('div',{ style:{ display:'flex', alignItems:'flex-start',
      padding: twoStage ? '0 16px 92px' : '0 16px 40px' } },
      leftRail, middle, panel);

    return h('div',{ class:'app-root'+(st.panelOpen?' panel-open':'')+(st.navOpen?' nav-open':''),
      ref:(el)=>{ this._rootEl = el; },
      style:{ minHeight:'100vh', background:'var(--color-bg)', color:'var(--color-text)', fontSize:'14px' } },
      this.buildNav(), topBar, main, twoStage ? this.buildPlanLegend() : null,
      st.reduceOpen ? this.buildReduceDialog() : (st.pubOpen ? this.buildPublishDialog(P) : null));
  },

  // Day-to-day only: what the status dot in each planned cell means.
  buildPlanLegend(){
    const item = (cls,label)=> h('div',{ class:'lg' },
      h('span',{ class:'plan-dot '+cls }), h('span',{}, label));
    return h('div',{ class:'plan-footer' },
      h('span',{ style:{ fontSize:'14px', color:'var(--color-text)' } }, 'Input field states:'),
      h('div',{ style:{ display:'flex', alignItems:'center', gap:'36px' } },
        item('st-none','Not published'),
        item('st-saved','Saved number'),
        item('st-pub','Published')));
  },

  _refreshPublish(){
    const twoStage = this._activeEdits === 'edits';
    const dirty = Object.keys(this.state[this._activeEdits] || {}).length > 0;
    if(twoStage){
      // derive both buttons from the same tally the render uses, so typing can
      // never leave Save armed for a change only Publish is allowed to apply
      const t = this.planTally();
      this.state.dailyUnsaved = t.dirty > 0;
      this.state.dailySaved = false;
      if(this._saveBtn && this._saveBtn.isConnected){
        this._saveBtn.toggleAttribute('disabled', !t.canSave);
        this._saveBtn.title = t.dirtyPublished
          ? 'These slots are already live — publish to apply the change'
          : 'Save these numbers in the platform';
      }
      if(this._publishBtn && this._publishBtn.isConnected){
        this._publishBtn.toggleAttribute('disabled', !t.canPublish);
        this._publishBtn.classList.toggle('btn-solid', t.canPublish);
      }
      if(this._statusLbl && this._statusLbl.isConnected){
        const msg = t.dirtyPublished
          ? (t.dirtyPublished + (t.dirtyPublished===1?' live slot edited':' live slots edited') + ' — publish to apply')
          : '';
        this._statusLbl.textContent = msg || 'Published \u2713';
        this._statusLbl.style.opacity = msg ? '1' : '0';
      }
      return;
    }
    if(this._publishBtn){
      this._publishBtn.toggleAttribute('disabled', !dirty);
      this._publishBtn.classList.toggle('btn-solid', dirty);
    }
  },
  // ---- planned-cell state ------------------------------------------------
  // A cell's live value is edits[key]; savedVals/pubVals are the snapshots taken
  // by Save and Publish. Everything else is derived, so the buttons and the field
  // styling can never disagree about what is pending.
  planCellState(key, cur){
    const pub = this.state.pubVals[key], sav = this.state.savedVals[key];
    if(pub !== undefined) return cur === pub ? 'published' : 'published-dirty';
    if(cur === '' || cur === undefined) return 'empty';
    if(sav !== undefined) return cur === sav ? 'saved' : 'draft';
    return 'draft';
  },
  // the field itself only distinguishes "still showing helper text" and "live
  // number with an unpublished edit" — the dot carries the rest
  planCellClass(state){
    return state==='published-dirty' ? ' is-pending-pub'
         : state==='empty'           ? ' is-helper'
         : '';
  },
  // grey = not published · orange = saved · green = published
  planDotClass(state){
    return state==='published' || state==='published-dirty' ? 'st-pub'
         : state==='saved' ? 'st-saved'
         : 'st-none';
  },
  // one pass over every cell we know about, so Save/Publish reflect the whole grid
  planTally(){
    const st = this.state, seen = {};
    let dirty = 0, dirtyPublished = 0, savedUnpublished = 0;
    [st.edits, st.savedVals, st.pubVals].forEach(m=> Object.keys(m).forEach(k=> seen[k]=1));
    Object.keys(seen).forEach(k=>{
      const pub = st.pubVals[k], sav = st.savedVals[k];
      const cur = st.edits[k] !== undefined ? st.edits[k] : (pub !== undefined ? pub : sav);
      if(cur === undefined) return;
      const state = this.planCellState(k, cur);
      if(state==='draft'){ dirty++; }
      if(state==='published-dirty'){ dirty++; dirtyPublished++; }
      if(pub === undefined && sav !== undefined && cur === sav) savedUnpublished++;
    });
    return { dirty, dirtyPublished, savedUnpublished,
      // Save is a draft commit. It cannot express a change to a number that is
      // already live, so the moment one of those is edited Save steps aside and
      // Publish becomes the only way to apply the batch.
      canSave: dirty>0 && dirtyPublished===0,
      canPublish: dirty>0 || savedUnpublished>0 };
  },
  // the matching Planning-templates value for a day-to-day cell, or '' if unset
  tplValueFor(ycId, rel, slotStart, modelKey){
    const wk = this.wkKeyForRel(rel);
    const v = this.state.tEdits['tpl|'+ycId+'|'+wk+'|'+slotStart+'|'+modelKey];
    return v === undefined ? '' : v;
  },

  // Save = commit the numbers in the platform (kept on this device, still internal)
  savePlanner(P){
    // snapshot every pending value that is not already live
    const st = this.state;
    Object.keys(st.edits).forEach(k=>{ if(st.pubVals[k] === undefined) st.savedVals[k] = st.edits[k]; });
    this.persistNow();
    this.setState({ dailyUnsaved:false, dailySaved:true, dailyUnpublished:true, [P.published]:false });
    clearTimeout(this._st2);
    this._st2 = setTimeout(()=> this.setState({ dailySaved:false }), 1800);
  },
  // ======================================================================
  // Reducing a committed number — the planner has to say why. Baseline is the
  // last committed value (published if there is one, otherwise saved); a first
  // entry has nothing to reduce from, so it passes straight through.
  // ======================================================================
  // Filter row, mirroring the Rental Capacity Plan screen. Fleet doubles as the
  // People/Business switch now that the tab pair is gone — see FLEET_VIEW below.
  FILTERS: [
    { id:'fleet',   label:'Fleet',              opts:['Yulu Corporate','Yulu Business'] },
    { id:'city',    label:'City',               opts:['Bangalore','Delhi NCR','Mumbai','Pune'] },
    { id:'cluster', label:'Cluster',            opts:['ALL','Cluster 1','Cluster 2','Cluster 3'] },
    { id:'cat',     label:'Bike Category',      opts:['ALL','DEX GR/NV','Miracle'] },
    { id:'billing', label:'Bike Billing Group', opts:['ALL'] },
  ],
  FLEET_VIEW: { 'Yulu Corporate':'people', 'Yulu Business':'business' },
  defaultFilters(){
    const o = {}; this.FILTERS.forEach(f=> o[f.id] = f.opts[0]); return o;
  },
  ensureFilters(){
    if(!this.state.filters) this.state.filters = this.defaultFilters();
    if(!this.state.draftFilters) this.state.draftFilters = Object.assign({}, this.state.filters);
  },
  applyFilters(){
    const d = Object.assign({}, this.state.draftFilters);
    // Fleet is the only filter wired to real behaviour; the rest are presentational
    this.setState({ filters:d, filterOpenId:null, view: this.FLEET_VIEW[d.fleet] || 'people' });
  },
  resetFilters(){
    const d = this.defaultFilters();
    this.setState({ filters:d, draftFilters:Object.assign({},d), filterOpenId:null,
      view: this.FLEET_VIEW[d.fleet] || 'people' });
  },
  // a segmented pill pair, the treatment the People/Business tabs used
  segmented(items){
    const accent = 'var(--color-accent)';
    return h('div',{ style:{ display:'inline-flex', border:'1px solid var(--color-divider)',
      borderRadius:'8px', overflow:'hidden' } },
      items.map((it,i)=> h('div',{ onClick: it.onClick,
        hover:{ background:'color-mix(in srgb, var(--color-text) 7%, transparent)' },
        style:{ display:'flex', alignItems:'center', height:'38px', padding:'0 18px', fontSize:'14px',
          cursor:'pointer', userSelect:'none', fontWeight:'500', whiteSpace:'nowrap',
          background: it.active ? 'color-mix(in srgb, var(--color-accent) 16%, transparent)':'transparent',
          color: it.active ? accent : 'var(--color-text)',
          borderRight: i<items.length-1 ? '1px solid var(--color-divider)' : 'none' } }, it.label)));
  },
  // The whole tree is rebuilt on every render, so a new node created already in
  // its final state has nothing to animate from. Mount it in the PREVIOUS state,
  // then flip the class a frame later so the transition actually runs.
  buildFilterWrap(){
    return h('div',{ class:'filter-wrap', ref:(el)=>{
        const open = this.state.filtersOpen;
        const was = (this._filtersWasOpen === undefined) ? open : this._filtersWasOpen;
        el.classList.toggle('open', was);
        if(was !== open){
          requestAnimationFrame(()=> requestAnimationFrame(()=>{
            if(el.isConnected) el.classList.toggle('open', open);
          }));
        }
        // record on EVERY render, or the first one leaves it undefined and the
        // next toggle mounts already-open with nothing to animate from
        this._filtersWasOpen = open;
      } },
      h('div',{ class:'filter-inner' }, this.buildFilterRow()));
  },
  buildFilterRow(){
    const st = this.state;
    const cell = (f)=> h('div',{ style:{ display:'flex', flexDirection:'column', gap:'5px', minWidth:'0' } },
      h('span',{ style:{ fontSize:'11px', fontWeight:'500', color:'var(--color-text-2)' } }, f.label),
      this.scDropdown({ label: st.draftFilters[f.id], open: st.filterOpenId===f.id, minWidth:150,
        toggle: ()=> this.setState({ filterOpenId: st.filterOpenId===f.id ? null : f.id }),
        items: f.opts.map(o=>({ label:o, active: st.draftFilters[f.id]===o,
          onClick: ()=>{ this.state.draftFilters = Object.assign({}, this.state.draftFilters, {[f.id]:o});
            this.setState({ filterOpenId:null }); } })) }));
    const dirty = this.FILTERS.some(f=> st.draftFilters[f.id] !== st.filters[f.id]);
    return h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'16px', flexWrap:'wrap',
      padding:'14px 20px', background:'var(--color-neutral-100)',
      borderBottom:'1px solid var(--color-divider)' } },
      this.FILTERS.map(cell),
      h('div',{ style:{ display:'flex', alignItems:'center', gap:'10px', marginLeft:'auto' } },
        h('button',{ class:'btn btn-primary', onClick: ()=> this.resetFilters(),
          style:{ height:'38px' } }, 'Reset'),
        h('button',{ class:'btn btn-primary'+(dirty?' btn-solid':''), disabled: !dirty,
          onClick: ()=> this.applyFilters(), style:{ height:'38px' } }, 'Apply')));
  },
  activeFilterCount(){
    const st = this.state, def = this.defaultFilters();
    return this.FILTERS.filter(f=> st.filters[f.id] !== def[f.id]).length;
  },
  filtersButton(){
    const on = this.state.filtersOpen, n = this.activeFilterCount();
    return h('button',{ onClick: ()=> this.setState({ filtersOpen: !on, filterOpenId:null }),
      title:'Filters', hover: on?null:{ borderColor:'var(--color-neutral-600)' },
      style:{ display:'flex', alignItems:'center', gap:'6px', height:'38px', padding:'0 14px',
        borderRadius:'8px', border:'1px solid '+(on?'var(--color-accent)':'var(--color-divider)'),
        background: on?'color-mix(in srgb, var(--color-accent) 12%, transparent)':'var(--color-surface)',
        color: on?'var(--color-accent)':'var(--color-text)', cursor:'pointer', fontSize:'14px',
        fontFamily:'var(--font-heading)', fontWeight:'500' } },
      h('span',{ html:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h13M4.5 9h9M7 13.5h4"/></svg>' }),
      'Filters',
      n ? h('span',{ style:{ minWidth:'18px', height:'18px', padding:'0 5px', borderRadius:'999px',
        background:'var(--color-accent)', color:'var(--color-accent-100)', fontSize:'11px', fontWeight:'700',
        display:'inline-flex', alignItems:'center', justifyContent:'center' } }, String(n)) : null);
  },

  REDUCE_REASONS: [
    { id:'swap',   label:'Excessive swap orders' },
    { id:'spare',  label:'Spare part storage' },
    { id:'other',  label:'Other' },
  ],
  planBaseline(key){
    const st = this.state;
    const b = st.pubVals[key] !== undefined ? st.pubVals[key] : st.savedVals[key];
    return (b === undefined || b === '') ? null : Number(b);
  },
  checkReduction(key, raw){
    if(this.state.reduceOpen) return;                 // already asking
    const base = this.planBaseline(key);
    if(base === null || raw === '' || raw == null) return;
    const val = Number(raw);
    if(!(val < base)) return;
    const had = this.state.reduceReasons[key];        // don't re-ask for the same change
    if(had && had.from === base && had.to === val) return;
    this.setState({ reduceOpen:true, reduceKey:key, reduceFrom:base, reduceTo:val,
      reduceChoice:null, reduceText:'' });
  },
  closeReduce(){ this.setState({ reduceOpen:false }); },
  // no reason given, so the reduction does not stand
  revertReduction(){
    const st = this.state, key = st.reduceKey;
    if(key){
      const base = this.planBaseline(key);
