  // ======================================================================
  //  SLOT CREATION (#1) — subdivide operating hours into slots
  // ======================================================================
  WEEK: [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']],
  // op hours identical across weekdays (an op-hours input); breaks are read-only;
  // `closed` lists weekdays with no operating hours for that YC.
  SLOT_YC: [
    {id:'hsr',  name:'HSR Yulu center',        op:[5,21],  breaks:[[12,13]], closed:[]},
    {id:'bell', name:'Bellandur Yulu center',  op:[9,21],  breaks:[],        closed:[]},
    {id:'kadu', name:'Kadubesanahalli YC',     op:[6,21],  breaks:[[14,15]], closed:[]},
    {id:'mara', name:'Marathahalli YC',        op:[8,20],  breaks:[[13,14]], closed:['sat','sun']},
    {id:'white',name:'Whitefield YC (24×7)',   op:[0,24],  breaks:[],        closed:[]},
    {id:'sarj', name:'Sarjapur YC',            op:[7,20],  breaks:[[13,14]], closed:['sun']},
  ],
  // no slot carries a locked/planned state — every defined slot is editable
  SLOT_SEED: {},

  wkToday(){ return ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()]; },
  wkKeyForRel(rel){ const dt=new Date(); dt.setDate(dt.getDate()+rel); return ['sun','mon','tue','wed','thu','fri','sat'][dt.getDay()]; },
  snap15(t){ return Math.max(0, Math.min(24, Math.round(t*4)/4)); },
  hhmm(t){ const h=Math.floor(t+1e-9), m=Math.round((t-h)*60); return this.pad(h)+':'+this.pad(m); },
  // diagonal hatch for every stretch of the 24h track that no slot covers — same
  // treatment as slot creation's off-hours, reused by templates and day-to-day
  hatchGaps(ranges){
    const HW = this.HOUR_W, sorted = ranges.slice().sort((a,b)=>a[0]-b[0]), out=[];
    let cur = 0;
    const push = (a,b)=>{ if(b-a > 0.001) out.push(h('div',{ class:'sc-offhours',
      style:{ position:'absolute', left:(a*HW)+'px', width:((b-a)*HW)+'px', top:'0', bottom:'0' } })); };
    sorted.forEach(r=>{ push(cur, r[0]); cur = Math.max(cur, r[1]); });
    push(cur, 24);
    return out;
  },
  segmentsOf(yc){
    const segs=[]; let cur=yc.op[0];
    (yc.breaks||[]).slice().sort((a,b)=>a[0]-b[0]).forEach(br=>{ if(br[0]>cur) segs.push([cur,br[0]]); cur=br[1]; });
    if(yc.op[1]>cur) segs.push([cur,yc.op[1]]);
    return segs;
  },
  getSlots(day, yc){
    const key = day+'|'+yc.id;
    if(this.state.slotEdits[key]) return this.state.slotEdits[key];
    if(this.SLOT_SEED[key]) return this.SLOT_SEED[key].map(a=>({start:a[0],end:a[1],planned:a[2],blocked:!!a[3]}));
    return this.segmentsOf(yc).map(sg=>({start:sg[0],end:sg[1],planned:false,blocked:false}));

  // ---- persistence -------------------------------------------------------
  // Everything the user authors survives a refresh: slot definitions, day-to-day
  // planned numbers and template values. localStorage is the primary store; when
  // the page is served from a sandboxed origin (the desktop preview runs it as a
  // data: URL, where localStorage throws) we fall back to window.name, which the
  // browser keeps for the lifetime of the tab across reloads.
  STORE_KEY: 'supplyPlanning.state.v2',
  _storeWrite(json){
    let ok = false;
    try{ localStorage.setItem(this.STORE_KEY, json); ok = true; }catch(e){}
    try{ window.name = this.STORE_KEY+'::'+json; ok = true; }catch(e){}
    this._storeOk = ok;
    return ok;
  },
  _storeRead(){
    try{ const v = localStorage.getItem(this.STORE_KEY); if(v) return v; }catch(e){}
    try{ if(window.name && window.name.indexOf(this.STORE_KEY+'::')===0) return window.name.slice(this.STORE_KEY.length+2); }catch(e){}
    return null;
  },
  snapshot(){
    const st = this.state;
    return { v:2, savedAt: Date.now(),
      slotEdits: st.slotEdits, edits: st.edits, tEdits: st.tEdits,
      savedVals: st.savedVals, pubVals: st.pubVals, schedule: st.schedule,
      reduceReasons: st.reduceReasons,
      dailyUnpublished: !!st.dailyUnpublished };
  },
  // debounced so typing in a field doesn't write on every keystroke
  persist(){
    clearTimeout(this._persistT);
    this._persistT = setTimeout(()=> this.persistNow(), 250);
  },
  persistNow(){
    this._storeWrite(JSON.stringify(this.snapshot()));
    if(this._savedTag) this._savedTag.textContent = this.savedLabel();
  },
  persistSlots(){ this.persist(); },   // kept: slot mutations call through here
  clockLabel(ts){ const d=new Date(ts); return this.pad(d.getHours())+':'+this.pad(d.getMinutes()); },
  // reads the store itself so the label is always true, whichever backend held the data
  savedLabel(){
    let ts = null;
    try{ const raw = this._storeRead(); if(raw){ const o = JSON.parse(raw); ts = o && o.savedAt; } }catch(e){}
    return ts ? ('Saved locally · '+this.clockLabel(ts)) : 'Changes are saved on this device';
  },
  loadSlots(){
    const raw = this._storeRead();
    if(!raw) return;
    let obj = null;
    try{ obj = JSON.parse(raw); }catch(e){ return; }
    if(!obj || typeof obj!=='object') return;
    // v1 stored the slot map alone at the top level
    if(obj.v !== 2){ this.state.slotEdits = obj; return; }
    if(obj.slotEdits && typeof obj.slotEdits==='object') this.state.slotEdits = obj.slotEdits;
    if(obj.edits    && typeof obj.edits==='object')     this.state.edits    = obj.edits;
    if(obj.tEdits   && typeof obj.tEdits==='object')    this.state.tEdits   = obj.tEdits;
    if(obj.savedVals&& typeof obj.savedVals==='object') this.state.savedVals= obj.savedVals;
    if(obj.pubVals  && typeof obj.pubVals==='object')   this.state.pubVals  = obj.pubVals;
    if(obj.schedule && typeof obj.schedule==='object')  this.state.schedule = obj.schedule;
    if(obj.reduceReasons && typeof obj.reduceReasons==='object') this.state.reduceReasons = obj.reduceReasons;
    this.state.dailyUnpublished = !!obj.dailyUnpublished;
    this._restoredAt = obj.savedAt || null;
  },
  resetStore(){
    try{ localStorage.removeItem(this.STORE_KEY); }catch(e){}
    try{ window.name = ''; }catch(e){}
    this.state.slotEdits = {}; this.state.edits = {}; this.state.tEdits = {};
    this.state.savedVals = {}; this.state.pubVals = {}; this.state.schedule = null;

      this.WEEK.map(([k,l])=> mkDay(k,l,false)),
      !this.SHOW_HOLIDAY ? null :
      h('div',{ class:'sc-daytab', onClick: ()=> this.setState({day:'hol', slotSel:null, bulkSel:{}, bulkResult:null}),
        hover:{ background:'color-mix(in srgb, var(--color-text) 7%, transparent)' },
        style:{ fontWeight: st.day==='hol'?'500':'500', borderLeft:'1px solid var(--color-divider)',
          background: st.day==='hol'? 'color-mix(in srgb, var(--color-accent) 16%, transparent)':'transparent',
          color: st.day==='hol'? accent : muted } }, 'Holiday')
    );

    // ----- publish -----
    const pubBtn = h('button',{ class:'btn btn-primary'+(st.slotDirty?' btn-solid':''), disabled: !st.slotDirty,
      onClick: ()=> this.onSlotPublish(), style:{ fontSize:'14px' } }, 'Update slots');
    const pubLbl = h('span',{ style:{ position:'absolute', top:'100%', right:'0', marginTop:'4px',
      whiteSpace:'nowrap', fontSize:'12px', color:accent, pointerEvents:'none', opacity: st.slotPublished?'1':'0' } }, 'Slots updated ✓');

    // ----- pivot picker (after the menu button) -----
    const pivotDd = this.scDropdown({ label: pivot==='yc' ? 'Yulu centers' : 'Weekday', open: st.pivotOpen, minWidth: 150,
      toggle: ()=> this.setState(ss=>({ pivotOpen:!ss.pivotOpen, ycOpen:false, cityOpen:false })),
      items: [
        {label:'Yulu centers', active: pivot==='yc',      onClick: ()=> this.setState({slotPivot:'yc', pivotOpen:false, slotSel:null})},
        {label:'Weekday',      active: pivot==='weekday', onClick: ()=> this.setState({slotPivot:'weekday', pivotOpen:false, slotSel:null})},
      ]});

    // ----- center selector: weekday tabs (yc pivot) OR YC picker (weekday pivot) -----
    const centerSel = pivot==='yc'
      ? h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'6px', margin:'0 auto' } }, dayTabs)
      : h('div',{ style:{ margin:'0 auto' } }, this.scDropdown({ label: selYc.name, open: st.ycOpen, minWidth: 200,
          toggle: ()=> this.setState(ss=>({ ycOpen:!ss.ycOpen, pivotOpen:false, cityOpen:false })),
          items: this.SLOT_YC.map(y=>({ label:y.name, active: y.id===st.slotYc, onClick: ()=> this.setState({slotYc:y.id, ycOpen:false, slotSel:null, bulkSel:{}, bulkResult:null}) })) }));

    const bulkBtn = h('button',{ onClick: ()=> this.toggleBulk(), title:'Slice and resize slots',
      hover: st.slotEdit?null:{ borderColor:'var(--color-neutral-600)' },
      style:{ display:'flex', alignItems:'center', gap:'6px', height:'38px', padding:'0 12px', borderRadius:'8px',
        border:'1px solid '+(st.slotEdit?'var(--color-accent)':'var(--color-divider)'),
        background: st.slotEdit?'color-mix(in srgb, var(--color-accent) 12%, transparent)':'var(--color-surface)',
        color: st.slotEdit?'var(--color-accent)':'var(--color-text)', cursor:'pointer', fontSize:'14px',
        fontFamily:'var(--font-heading)', fontWeight:'500' } },
      h('span',{ html:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="6" height="5" rx="1"/><rect x="2.5" y="10" width="6" height="5" rx="1"/><path d="M11.5 5.5h4M11.5 12.5h4"/></svg>' }),
      'Create slots');

    const typeBtn = h('button',{ onClick: ()=> this.toggleTypeMode(), title:'Set slots as Planned or Blocked',
      hover: st.typeMode?null:{ borderColor:'var(--color-neutral-600)' },
      style:{ display:'flex', alignItems:'center', gap:'6px', height:'38px', padding:'0 12px', borderRadius:'8px',
        border:'1px solid '+(st.typeMode?'var(--color-accent)':'var(--color-divider)'),
        background: st.typeMode?'color-mix(in srgb, var(--color-accent) 12%, transparent)':'var(--color-surface)',
        color: st.typeMode?'var(--color-accent)':'var(--color-text)', cursor:'pointer', fontSize:'14px',
        fontFamily:'var(--font-heading)', fontWeight:'500' } },
      h('span',{ html:'<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="13" height="8" rx="1.5"/><path d="M6 5 3 13M11 5 8 13"/></svg>' }),
      'Define slot type');

    const topRow = h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'16px', padding:'12px 20px',
      background:'var(--color-bg)', borderBottom:'1px solid var(--color-divider)' } },
      this.makeMenuBtn(), centerSel,
      h('div',{ style:{ display:'flex', alignItems:'flex-end', gap:'12px', marginLeft:'auto' } },
        bulkBtn, typeBtn,
        this.labeledCtl('Viewing options', pivotDd),
        h('div',{ style:{ position:'relative', display:'flex', alignItems:'flex-end' } }, pubBtn, pubLbl))
    );

    // ----- ruler (00–24, 15-min grid drawn on the track) -----
    const hourEls=[];
    for(let i=0;i<=24;i++){
      hourEls.push(h('div',{ style:{ position:'absolute', left:(i*HW)+'px', top:'0', height:'32px',
        borderLeft:'1px solid var(--color-divider)', paddingLeft:'3px', fontSize:(HW<40?'10px':'12px'), color:muted,
        display:'flex', alignItems:'flex-end', paddingBottom:'3px' } }, (HW<36 && i%2) ? '' : this.pad(i)));
    }
    const rulerRow = h('div',{ style:{ display:'flex', alignItems:'flex-start', padding:'14px 16px 10px',
      borderBottom:'1px solid var(--color-divider)', background:'var(--color-bg)' } },
      h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)', height:'32px', display:'flex',
        alignItems:'flex-end', paddingBottom:'2px', fontSize:'14px', fontWeight:'500' } }, 'Time of the day:'),
      h('div',{ class:'tl-ruler', ref:(el)=>{this._rulerEl=el;},
        style:{ flex:'1 1 auto', minWidth:'0', overflow:'hidden', margin:'0 10px' } },
        h('div',{ style:{ position:'relative', width:trackW+'px', height:'32px' } }, hourEls)),
      sel ? h('div',{ style:{ flex:'0 0 '+panelW+'px', width:panelW+'px', height:'32px' } }) : null
    );

    const topBar = h('div',{ style:{ position:'sticky', top:'0', zIndex:'30', background:'var(--color-bg)' } }, topRow, rulerRow);

    // ----- holiday empty state (YC pivot only — every YC lacks holiday hours) -----
    if(this.SHOW_HOLIDAY && pivot==='yc' && day==='hol'){
      const empty = h('div',{ style:{ minHeight:'55vh', display:'flex', flexDirection:'column', alignItems:'center',
        justifyContent:'center', gap:'10px', textAlign:'center', padding:'40px' } },
        h('div',{ style:{ fontFamily:'var(--font-heading)', fontWeight:'500', fontSize:'20px' } }, 'Holiday'),
        h('div',{ style:{ fontSize:'14px', color:muted, maxWidth:'360px' } },
          'No operating hours are defined for holidays yet — slots can be created once they are.'));
      return h('div',{ class:'app-root'+(st.navOpen?' nav-open':''), ref:(el)=>{ this._rootEl=el; },
        style:{ minHeight:'100vh', background:'var(--color-bg)', color:'var(--color-text)', fontSize:'14px' } },
        this.buildNav(), topBar, empty);
    }

    const slotLabel = (w,s,e)=> w>72 ? this.hhmm(s)+'–'+this.hhmm(e) : (w>34 ? this.hhmm(s) : '');
    const LOCK = '<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><rect x="2.5" y="6" width="9" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4.3 6V4.5a2.7 2.7 0 0 1 5.4 0V6" stroke="currentColor" stroke-width="1.3"/></svg>';

    // build one timeline row for a (day, yc) pair — split / drag / merge live here
    this._bulkGhosts = {};   // rowKey -> {el, lbl}, so a bulk hover can preview across all selected rows
    const makeRow = (rday, yc)=>{
      const rowInner = h('div',{ style:{ position:'relative', height:rowH+'px', width:trackW+'px' } });
      const closed = (rday==='hol') || yc.closed.indexOf(rday)!==-1;
      if(closed){
        rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute', left:'0', width:(24*HW)+'px',
          top:'0', bottom:'0', borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center' } },
          h('span',{ style:{ fontSize:'12px', color:muted } }, rday==='hol'?'No operating hours':'Closed')));
        return rowInner;
      }
      const slots = this.getSlots(rday, yc);

      // off-hours
      if(yc.op[0]>0) rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute', left:'0',
        width:(yc.op[0]*HW)+'px', top:'0', bottom:'0' } }));
      if(yc.op[1]<24) rowInner.appendChild(h('div',{ class:'sc-offhours', style:{ position:'absolute',
        left:(yc.op[1]*HW)+'px', width:((24-yc.op[1])*HW)+'px', top:'0', bottom:'0' } }));

      // breaks — inset with breathing room, aligned to the slot bars
      yc.breaks.forEach(br=> rowInner.appendChild(h('div',{ class:'sc-break', title:'Break '+this.hhmm(br[0])+'–'+this.hhmm(br[1]),
        style:{ position:'absolute', left:(br[0]*HW)+'px', width:((br[1]-br[0])*HW)+'px', top:'4px', bottom:'4px',
          borderRadius:'6px', display:'flex', alignItems:'center', justifyContent:'center' } },
        (br[1]-br[0])*HW>52 ? h('span',{ style:{ fontSize:'10px', color:muted } }, 'Break') : null)));

      // slot bars — two-line (Slot N + range), inset like the day-to-day bars (keep refs for drag)
      const slotEls = [];
      slots.forEach((sl,si)=>{
        const w = (sl.end-sl.start)*HW;
        const rng = w>60 ? this.hhmm(sl.start)+'–'+this.hhmm(sl.end) : (w>34 ? this.hhmm(sl.start) : '');
        const selKey = rday+'|'+yc.id+'|'+si;
        const picked = !!st.typeSel[selKey];
        const el = h('div',{ class:'sc-slot'+(st.slotEdit?' editable':'')
            +(st.typeMode?' pickable':'')+(picked?' picked':''),
          title: this.hhmm(sl.start)+'–'+this.hhmm(sl.end)+' · '+(sl.blocked?'Blocked':'Planned'),
          style:{ position:'absolute', left:(sl.start*HW)+'px', width:w+'px', top:'4px', bottom:'4px',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1px', lineHeight:'1.05',
            borderRadius:'6px', pointerEvents: st.typeMode?'auto':'none', fontVariantNumeric:'tabular-nums',
            background: sl.blocked ? 'repeating-linear-gradient(45deg, color-mix(in srgb,var(--color-text) 6%,transparent) 0 6px, transparent 6px 12px), var(--color-surface)' : 'var(--color-neutral-900)',
            border:'1px solid var(--color-neutral-600)', color:'var(--color-text)' } },
          w>44 ? h('span',{ style:{ fontWeight:'700', fontSize:'13px' } }, 'Slot '+(si+1)) : null,
          h('span',{ class:'sc-rng', style:{ fontSize:'11px', color:'var(--color-text-2)' } }, rng),
          w>70 ? h('span',{ class:'sc-type', style:{ color: sl.blocked?'var(--color-text-2)':'var(--color-text-3)' } },
            sl.blocked?'Blocked':'Planned') : null);
        if(st.typeMode) el.addEventListener('click',(e)=>{ e.stopPropagation(); this.toggleTypeSlot(selKey); });
        slotEls.push(el); rowInner.appendChild(el);
      });

      // internal dividers — draggable (resize) + merge (remove)
      for(let i=0;i<slots.length-1;i++){
        if(Math.abs(slots[i].end - slots[i+1].start) >= 1e-9) continue;
        const li = i, locked = slots[li].planned || slots[li+1].planned || !st.slotEdit;
        const wrap = h('div',{ class:'sc-div'+(locked?' locked':''),
          title: !st.slotEdit ? this.hhmm(slots[li].end)
               : (locked?'Locked boundary (planned slot)':'Drag to move · hover to merge'),
          style:{ left:(slots[li].end*HW-7)+'px', top:'4px', bottom:'4px' } }, h('div',{class:'ln'}));
        if(!locked){
          const mb = h('button',{ class:'sc-merge', title:'Merge these two slots',
            html:'<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 L7 7 L4 11"/><path d="M10 3 L7 7 L10 11"/></svg>' });
          wrap.appendChild(mb);
          const leftEl = slotEls[li], rightEl = slotEls[li+1];
          wrap.addEventListener('mousedown',(e)=>{
            if(e.target.closest('.sc-merge')) return;
            e.preventDefault(); e.stopPropagation();
            this._scDragging = true;
            const lo = slots[li].start + 0.25, hi = slots[li+1].end - 0.25;
            const rect = rowInner.getBoundingClientRect();
            let curT = slots[li].end;
            const setRng = (el,w,s,e)=>{ const r=el.querySelector('.sc-rng');
              if(r) r.textContent = w>60 ? this.hhmm(s)+'–'+this.hhmm(e) : (w>34 ? this.hhmm(s) : ''); };
            const move = (ev)=>{
              let t = this.snap15((ev.clientX-rect.left)/HW);
              t = Math.max(lo, Math.min(hi, t));
              curT = t;
              leftEl.style.width = ((t-slots[li].start)*HW)+'px';
              setRng(leftEl, (t-slots[li].start)*HW, slots[li].start, t);
              rightEl.style.left = (t*HW)+'px';
              rightEl.style.width = ((slots[li+1].end-t)*HW)+'px';
              setRng(rightEl, (slots[li+1].end-t)*HW, t, slots[li+1].end);
              wrap.style.left = (t*HW-7)+'px';
            };
            const up = ()=>{
              document.removeEventListener('mousemove', move);
              document.removeEventListener('mouseup', up);
              this._scDragging = false;
              this._scSuppressClick = true; setTimeout(()=>{ this._scSuppressClick=false; }, 0);
              if(Math.abs(curT - slots[li].end) > 1e-9){
                const next = slots.slice();
                next[li]   = {start:slots[li].start, end:curT,            planned:slots[li].planned,   blocked:slots[li].blocked};
                next[li+1] = {start:curT,            end:slots[li+1].end, planned:slots[li+1].planned, blocked:slots[li+1].blocked};
                this.setSlots(rday, yc.id, next);
              }
            };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', up);
          });
          mb.addEventListener('click',(e)=>{
            e.stopPropagation();
            // with rows ticked this removes the boundary on every selected row,
            // mirroring how a click slices them all
            if(Object.keys(this.state.bulkSel).length){ this.applyBulkMerge(slots[li].end); return; }
            const next = slots.slice(0,li)
              .concat([{start:slots[li].start, end:slots[li+1].end, planned:false,
                        blocked: !!(slots[li].blocked && slots[li+1].blocked)}])
              .concat(slots.slice(li+2));
            this.setSlots(rday, yc.id, next);
          });
        }
        rowInner.appendChild(wrap);
      }

      // ghost cut line (shared by split + bulk placement)
      const ghost = h('div',{ class:'sc-ghost' }, h('div',{class:'line'}), h('div',{class:'lbl'}));
      const ghostLbl = ghost.querySelector('.lbl');
      rowInner.appendChild(ghost);
      if(st.slotEdit) this._bulkGhosts[rday+'|'+yc.id] = { el:ghost, lbl:ghostLbl };

      if(st.slotEdit){
        // One editing mode. Hovering previews the cut; clicking applies it.
        // With rows ticked the cut lands on every selected row; with none ticked
        // it lands on the row under the cursor.
        const inSlot = (t)=> slots.find(s=> t>s.start+1e-9 && t<s.end-1e-9 && !s.planned
          && (t-s.start)>=0.25-1e-9 && (s.end-t)>=0.25-1e-9);
        const anySel = ()=> Object.keys(this.state.bulkSel).length>0;
        const previewAll = (t)=>{
          const sel = this.state.bulkSel;
          for(const k in this._bulkGhosts){
            const g = this._bulkGhosts[k];
            if(sel[k]){ g.el.style.display='block'; g.el.style.left=(t*HW)+'px'; g.lbl.textContent=this.hhmm(t); }
            else { g.el.style.display='none'; }
          }
        };
        const hideAll = ()=>{ for(const k in this._bulkGhosts) this._bulkGhosts[k].el.style.display='none'; };
        rowInner.addEventListener('mousemove',(e)=>{
          if(this._scDragging){ hideAll(); ghost.style.display='none'; return; }
          const rect = rowInner.getBoundingClientRect();
          const t = this.snap15((e.clientX-rect.left)/HW);
          if(anySel()){ previewAll(t); rowInner.style.cursor='crosshair'; return; }
          if(inSlot(t)){ ghost.style.display='block'; ghost.style.left=(t*HW)+'px';
            ghostLbl.textContent=this.hhmm(t); rowInner.style.cursor='crosshair'; }
          else { ghost.style.display='none'; rowInner.style.cursor='default'; }
        });
        rowInner.addEventListener('mouseleave',()=>{ hideAll(); ghost.style.display='none'; });
        rowInner.addEventListener('click',(e)=>{
          if(this._scSuppressClick) return;
          const rect = rowInner.getBoundingClientRect();
          const t = this.snap15((e.clientX-rect.left)/HW);
          if(anySel()){ this.applyBulkSlice(t); return; }
          const idx = slots.findIndex(s=> t>s.start+1e-9 && t<s.end-1e-9 && !s.planned
            && (t-s.start)>=0.25-1e-9 && (s.end-t)>=0.25-1e-9);
          if(idx<0) return;
          const s = slots[idx];
          const next = slots.slice(0,idx)
            .concat([{start:s.start,end:t,planned:false,blocked:s.blocked},
                     {start:t,end:s.end,planned:false,blocked:s.blocked}])
            .concat(slots.slice(idx+1));
          this.setSlots(rday, yc.id, next);
        });
      }
      return rowInner;
    };

    // rows depend on the pivot
    const defs = pivot==='yc'
      ? this.SLOT_YC.map(yc=>({ rday: day, yc, title: yc.name }))
      : this.WEEK.map(([k])=>({ rday:k, yc: selYc, title: FULL[k] }))
          .concat(this.SHOW_HOLIDAY ? [{ rday:'hol', yc: selYc, title:'Holiday' }] : []);

    this._bulkDefs = defs;
    this.noteMinSlot(defs.reduce((acc,d)=>{
      const closed = (d.rday==='hol') || d.yc.closed.indexOf(d.rday)!==-1;
      return closed ? acc : acc.concat(this.getSlots(d.rday, d.yc).map(sl=> sl.end - sl.start));
    }, []));
    const leftRows=[], midRows=[];
    defs.forEach(d=>{
      const closed = (d.rday==='hol') || d.yc.closed.indexOf(d.rday)!==-1;
      const key = d.rday+'|'+d.yc.id;
      const selectable = st.slotEdit && !closed;
      const bsel = !!st.bulkSel[key];
      leftRows.push(h('div',{
        onClick: selectable ? ()=> this.toggleBulkRow(key) : null,
        hover: selectable && !bsel ? { borderColor:'var(--color-neutral-600)' } : null,
        style:{ height:rowH+'px', marginBottom:gap+'px', display:'flex', alignItems:'center', gap:'10px',
          padding:'0 12px', borderRadius:'8px', boxShadow:'0 1px 2px rgba(0,0,0,.05)',
          border:'1px solid '+((st.slotEdit&&bsel)?'var(--color-accent)':'var(--color-divider)'),
          background:(st.slotEdit&&bsel)?'color-mix(in srgb, var(--color-accent) 10%, transparent)':'var(--color-surface)',
          opacity: closed? '.6':'1', cursor: selectable?'pointer':'default' } },
        st.slotEdit ? h('div',{ style:{ width:'18px', height:'18px', flex:'none', borderRadius:'5px',
          display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-accent-100)',
          border:'1px solid '+(bsel?'var(--color-accent)':'var(--color-neutral-600)'),
          background: bsel?'var(--color-accent)':'transparent', opacity: closed?'.4':'1' },
          html: bsel?'<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 L6 10.5 L11 4"/></svg>':'' }) : null,
        h('div',{ style:{ flex:'1', minWidth:'0', display:'flex', flexDirection:'column', gap:'2px' } },
          h('div',{ style:{ fontWeight:'500', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' } }, d.title),
          h('div',{ style:{ fontSize:'11px', color:muted } }, opSub(d.yc, d.rday)))
      ));
      midRows.push(h('div',{ style:{ marginBottom:gap+'px' } }, makeRow(d.rday, d.yc)));
    });

    const headH = st.slotEdit ? 34 : 16;
    const leftRail = h('div',{ style:{ flex:'0 0 var(--left-w)', width:'var(--left-w)' } },
      h('div',{ style:{ height:headH+'px', display:'flex', alignItems:'center' } },
        st.slotEdit ? this.buildSelectAllRow(defs) : null),
      leftRows);
    const middle = h('div',{ class:'tl-scroll', ref:(el)=>{this._scrollEl=el;},
      onScroll:(e)=>{ if(this._rulerEl) this._rulerEl.scrollLeft = e.target.scrollLeft; },
      style:{ flex:'1 1 auto', minWidth:'0', overflowX:'auto', overflowY:'hidden', margin:'0 10px' } },
      h('div',{ style:{ width:trackW+'px' } }, h('div',{ style:{ height:headH+'px' } }), midRows));
    const main = h('div',{ style:{ display:'flex', alignItems:'flex-start', padding:'0 16px 40px' } },
      leftRail, middle, sel ? this.buildSlotPanel(sel, panelW) : null);

    return h('div',{ class:'app-root'+(st.navOpen?' nav-open':''), ref:(el)=>{ this._rootEl=el; },
      style:{ minHeight:'100vh', background:'var(--color-bg)', color:'var(--color-text)', fontSize:'14px' } },
      this.buildNav(), topBar, main,
      st.slotEdit ? this.buildBulkBar() : (st.typeMode ? this.buildTypeBar() : null));
  },

  toggleBulk(){ this.setState({ slotEdit: !this.state.slotEdit, bulkSel:{}, bulkResult:null, slotSel:null,
    typeMode:false, typeSel:{}, typePick:null }); },
  // rows that can actually take a cut — closed days are never selectable
  selectableRowKeys(defs){
    return (defs || this._bulkDefs || [])
      .filter(d=> !(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1))
      .map(d=> d.rday+'|'+d.yc.id);
  },
  toggleSelectAllRows(){
    const keys = this.selectableRowKeys();
    const all = keys.length>0 && keys.every(k=> this.state.bulkSel[k]);
    const next = {};
    if(!all) keys.forEach(k=> next[k]=true);   // partial or none -> select all
    this.setState({ bulkSel: next, bulkResult:null });
  },
  buildSelectAllRow(defs){
    const keys = this.selectableRowKeys(defs);
    const n = keys.filter(k=> this.state.bulkSel[k]).length;
    const state = n===0 ? 'none' : (n===keys.length ? 'all' : 'some');
    const accent = 'var(--color-accent)';
    return h('div',{ onClick: ()=> this.toggleSelectAllRows(),
      hover:{ color:'var(--color-text)' },
      style:{ display:'flex', alignItems:'center', gap:'10px', padding:'0 12px', cursor:'pointer',
        height:'100%', borderRadius:'6px',
        userSelect:'none', fontSize:'12px', fontWeight:'500',
        color: state==='none' ? 'color-mix(in srgb, var(--color-text) 55%, transparent)' : 'var(--color-text)' } },
      h('div',{ style:{ width:'18px', height:'18px', flex:'none', borderRadius:'5px',
          display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-accent-100)',
          border:'1px solid '+(state==='none'?'var(--color-neutral-600)':accent),
          background: state==='none'?'transparent':accent },
        html: state==='all'
          ? '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 L6 10.5 L11 4"/></svg>'
          : (state==='some' ? '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 7h7"/></svg>' : '') }),
      h('span',{}, state==='all' ? 'Deselect all' : 'Select all'));
  },
  toggleBulkRow(key){
    const b = Object.assign({}, this.state.bulkSel);
    if(b[key]) delete b[key]; else b[key] = true;
    this.setState({ bulkSel:b, bulkResult:null });
  },
  applyBulkSlice(T){
    const defs = this._bulkDefs || [];
    let applied=0, skipped=0;
    defs.forEach(d=>{
      const key = d.rday+'|'+d.yc.id;
      if(!this.state.bulkSel[key]) return;
      if(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1){ skipped++; return; }
      const slots = this.getSlots(d.rday, d.yc);
      const idx = slots.findIndex(s=> T>s.start+1e-9 && T<s.end-1e-9 && !s.planned
        && (T-s.start)>=0.25-1e-9 && (s.end-T)>=0.25-1e-9);
      if(idx<0){ skipped++; return; }
      const s = slots[idx];
      this.state.slotEdits[d.rday+'|'+d.yc.id] = slots.slice(0,idx)
        .concat([{start:s.start,end:T,planned:false,blocked:s.blocked},
                 {start:T,end:s.end,planned:false,blocked:s.blocked}])
        .concat(slots.slice(idx+1));
      applied++;
    });
    if(applied>0){ this.state.slotDirty = true; this.persistSlots(); }
    this.state.bulkAt = T;
    this.state.bulkResult = { applied, skipped, at:T };
    this.render();
  },
  // ======================================================================
  // Define slot type — Planned (plan + book) vs Blocked (no planning table
  // anywhere). Selection is per slot, so indices are safe: slicing is off in
  // this mode, which means a slot's index can't shift under a live selection.
  // ======================================================================
  toggleTypeMode(){
    this.setState({ typeMode: !this.state.typeMode, typeSel:{}, typePick:null,
      slotEdit:false, bulkSel:{}, bulkResult:null, slotSel:null });
  },
  toggleTypeSlot(key){
    const t = Object.assign({}, this.state.typeSel);
    if(t[key]) delete t[key]; else t[key] = true;
    // the staged choice is only meaningful against a selection — drop it when
    // the selection changes, so Update never applies a type the user can't see
    this.setState({ typeSel:t, typePick:null });
  },
  // every selected slot, resolved back to its row + index
  typeSelected(){
    const out = [];
    Object.keys(this.state.typeSel).forEach(k=>{
      const p = k.split('|'); const idx = +p[2];
      const yc = this.SLOT_YC.find(y=> y.id===p[1]); if(!yc) return;
      const slots = this.getSlots(p[0], yc);
      if(idx < slots.length) out.push({ key:k, rday:p[0], yc, idx, slot:slots[idx] });
    });
    return out;
  },
  applySlotType(){
    const pick = this.state.typePick; if(!pick) return;
    const blocked = pick==='blocked';
    const byRow = {};
    this.typeSelected().forEach(it=>{
      const rk = it.rday+'|'+it.yc.id;
      if(!byRow[rk]) byRow[rk] = { rday:it.rday, ycId:it.yc.id, slots:this.getSlots(it.rday,it.yc).slice(), idxs:[] };
      byRow[rk].idxs.push(it.idx);
    });
    let changed = 0;
    Object.keys(byRow).forEach(rk=>{
      const r = byRow[rk];
      r.idxs.forEach(i=>{
        if(!!r.slots[i].blocked === blocked) return;
        r.slots[i] = Object.assign({}, r.slots[i], { blocked });
        changed++;
      });
      this.state.slotEdits[rk] = r.slots;
    });
    if(changed){ this.state.slotDirty = true; this.persistSlots(); }
    this.state.typeResult = { changed, type: blocked?'Blocked':'Planned' };
    this.state.typePick = null;
    this.render();
  },
  buildTypeBar(){
    const st = this.state, accent='var(--color-accent)',
          muted='color-mix(in srgb, var(--color-text) 55%, transparent)';
    const sel = this.typeSelected(), count = sel.length;
    const nBlocked = sel.filter(x=> x.slot.blocked).length, nPlanned = count - nBlocked;
    const sep = ()=> h('div',{ style:{ width:'1px', height:'24px', background:'var(--color-divider)' } });

    // tri-state per option: all / some (mixed) / none of the selection is this type
    const mark = (state)=> h('div',{ style:{ width:'16px', height:'16px', flex:'none', borderRadius:'5px',
        display:'flex', alignItems:'center', justifyContent:'center', color:'var(--color-accent-100)',
        border:'1px solid '+(state==='none'?'var(--color-neutral-600)':accent),
        background: state==='none'?'transparent':accent },
      html: state==='all'
        ? '<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 L6 10.5 L11 4"/></svg>'
        : (state==='some' ? '<svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3.5 7h7"/></svg>' : '') });

    const opt = (id,label,n)=>{
      // once a type is staged it wins the display; until then we mirror the selection
      const state = st.typePick ? (st.typePick===id?'all':'none')
                  : (count===0 ? 'none' : (n===count ? 'all' : (n>0 ? 'some' : 'none')));
      const on = state!=='none';
      return h('button',{ onClick: count? ()=> this.setState({ typePick:id, typeResult:null }) : null,
        hover: count?{ borderColor:'var(--color-neutral-600)' }:null,
        style:{ display:'flex', alignItems:'center', gap:'8px', height:'34px', padding:'0 12px', borderRadius:'8px',
          border:'1px solid '+(on?accent:'var(--color-divider)'),
          background: on?'color-mix(in srgb, var(--color-accent) 10%, transparent)':'transparent',
          color: count?'var(--color-text)':muted, cursor: count?'pointer':'default',
          fontSize:'14px', fontFamily:'var(--font-heading)', fontWeight:'500', opacity: count?'1':'.55' } },
        mark(state), label);
    };

    const canApply = !!st.typePick && count>0;
    return h('div',{ style:{ position:'fixed', left:'50%', bottom:'20px', transform:'translateX(-50%)', zIndex:'45',
      display:'flex', alignItems:'center', gap:'12px', padding:'10px 16px', borderRadius:'12px',
      background:'var(--color-surface)', border:'1px solid var(--color-neutral-700)', boxShadow:'var(--shadow-md)' } },
      h('span',{ style:{ fontSize:'13px', fontWeight:'500', whiteSpace:'nowrap' } },
        count ? (count+(count===1?' slot selected':' slots selected')) : 'Select slots to set their type'),
      sep(),
      opt('planned','Planned',nPlanned),
      opt('blocked','Blocked',nBlocked),
      st.typeResult ? [ sep(),
        h('span',{ style:{ fontSize:'12px', color: st.typeResult.changed?accent:muted, whiteSpace:'nowrap' } },
          st.typeResult.changed ? ('\u2713 '+st.typeResult.changed+' set to '+st.typeResult.type)
                                : 'Already '+st.typeResult.type) ] : null,
      sep(),
      h('button',{ class:'btn btn-primary'+(canApply?' btn-solid':''), disabled: !canApply,
        onClick: ()=> this.applySlotType(),
        style:{ height:'32px', fontSize:'14px' } }, 'Update'),
      h('button',{ onClick: ()=> this.toggleTypeMode(),
        hover:{ background:'color-mix(in srgb, var(--color-text) 6%, transparent)' },
        style:{ height:'32px', padding:'0 14px', background:'transparent', border:'1px solid var(--color-divider)',
          borderRadius:'8px', color:'var(--color-text)', cursor:'pointer', fontSize:'14px', fontWeight:'500' } }, 'Done')
    );
  },

  // remove the boundary at T on every selected row (the multi-row counterpart of
  // the per-divider merge). A row without a boundary there is skipped, not forced.
  applyBulkMerge(T){
    const defs = this._bulkDefs || [];
    let applied=0, skipped=0;
    defs.forEach(d=>{
      const key = d.rday+'|'+d.yc.id;
      if(!this.state.bulkSel[key]) return;
      if(d.rday==='hol' || d.yc.closed.indexOf(d.rday)!==-1){ skipped++; return; }
      const slots = this.getSlots(d.rday, d.yc);
      const i = slots.findIndex((sl,ix)=> ix < slots.length-1
        && Math.abs(sl.end - T) < 1e-9
        && Math.abs(sl.end - slots[ix+1].start) < 1e-9
        && !sl.planned && !slots[ix+1].planned);
      if(i<0){ skipped++; return; }
      this.state.slotEdits[key] = slots.slice(0,i)
        .concat([{start:slots[i].start, end:slots[i+1].end, planned:false,
                  blocked: !!(slots[i].blocked && slots[i+1].blocked)}])
        .concat(slots.slice(i+2));
      applied++;
    });
    if(applied>0){ this.state.slotDirty = true; this.persistSlots(); }
    this.state.bulkAt = T;
    this.state.bulkResult = { applied, skipped, at:T, verb:'merged' };
    this.render();
  },
  buildBulkBar(){
    const st = this.state, accent='var(--color-accent)', muted='color-mix(in srgb, var(--color-text) 55%, transparent)';
    const count = Object.keys(st.bulkSel).length;
    const sep = ()=> h('div',{ style:{ width:'1px', height:'24px', background:'var(--color-divider)' } });

    return h('div',{ style:{ position:'fixed', left:'50%', bottom:'20px', transform:'translateX(-50%)', zIndex:'45',
      display:'flex', alignItems:'center', gap:'12px', padding:'10px 16px', borderRadius:'12px',
      background:'var(--color-surface)', border:'1px solid var(--color-neutral-700)', boxShadow:'var(--shadow-md)' } },
      h('span',{ style:{ fontSize:'13px', fontWeight:'500', whiteSpace:'nowrap' } },
        count ? (count+' rows selected') : 'Creating slots'),
      sep(),
      h('span',{ style:{ fontSize:'13px', color:muted, whiteSpace:'nowrap' } },
        count ? 'Click the timeline to slice all selected · merge removes that boundary on all of them'
              : 'Click a slot to slice it · tick rows to slice or merge several at once'),
      st.bulkResult ? [ sep(),
        h('span',{ style:{ fontSize:'12px', color: st.bulkResult.applied?accent:muted, whiteSpace:'nowrap' } },
          '✓ '+st.bulkResult.applied+' '+(st.bulkResult.verb||'sliced')
            +(st.bulkResult.skipped?' · '+st.bulkResult.skipped+' skipped':'')) ] : null,
      sep(),
      h('button',{ onClick: ()=> this.toggleBulk(),
        hover:{ background:'color-mix(in srgb, var(--color-text) 6%, transparent)' },
        style:{ height:'32px', padding:'0 14px', background:'transparent', border:'1px solid var(--color-divider)',
          borderRadius:'8px', color:'var(--color-text)', cursor:'pointer', fontSize:'14px', fontWeight:'500' } }, 'Done')
    );
  },

  // selection side panel — precise edit of the selected boundary
  buildSlotPanel(sel, panelW){
    const muted='color-mix(in srgb, var(--color-text) 55%, transparent)', accent='var(--color-accent)';
    const { yc, day, bi, slots } = sel;
    const a = slots[bi], b = slots[bi+1];
    const locked = a.planned || b.planned;
    const at = a.end, lo = a.start + 0.25, hi = b.end - 0.25;
    const DAYS = {mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday',hol:'Holiday'};

    const setAt = (t)=>{
      t = this.snap15(Math.max(lo, Math.min(hi, t)));
      if(Math.abs(t-at)<1e-9) return;
      const next = slots.slice();
      next[bi]   = {start:a.start, end:t,     planned:a.planned, blocked:a.blocked};
      next[bi+1] = {start:t,       end:b.end, planned:b.planned, blocked:b.blocked};
      this.state.slotSel = { ycId:yc.id, day, at:t };
      this.setSlots(day, yc.id, next);
    };
    const merge = ()=>{
      const next = slots.slice(0,bi)
        .concat([{start:a.start, end:b.end, planned:false, blocked: !!(a.blocked && b.blocked)}])
        .concat(slots.slice(bi+2));
      this.state.slotSel = null;
      this.setSlots(day, yc.id, next);
    };
    const close = ()=> this.setState({ slotSel:null });

    const chip = (s,e,planned)=> h('div',{ style:{ flex:'1', textAlign:'center', padding:'8px 6px', borderRadius:'6px',
      fontSize:'13px', fontVariantNumeric:'tabular-nums',
      background: planned ? 'var(--color-neutral-900)' : 'color-mix(in srgb, var(--color-accent) 12%, transparent)',
      border:'1px solid '+(planned?'var(--color-divider)':'var(--color-accent-700)'),
      color: planned?muted:'var(--color-text)' } }, this.hhmm(s)+'–'+this.hhmm(e));

    const stepBtn = (label, fn, disabled)=> h('button',{ onClick: disabled?null:fn, disabled,
      style:{ width:'34px', height:'34px', flex:'none', display:'flex', alignItems:'center', justifyContent:'center',
        background:'var(--color-surface)', border:'1px solid var(--color-divider)', borderRadius:'6px',
        color:'var(--color-text)', cursor:disabled?'not-allowed':'pointer', fontSize:'16px', opacity:disabled?'.45':'1' } }, label);

    const inp = h('input',{ type:'text', inputmode:'numeric', value:this.hhmm(at), disabled: locked,
      style:{ flex:'1', minWidth:'0', textAlign:'center', height:'34px', border:'1px solid var(--color-divider)',
        borderRadius:'6px', background:'var(--color-surface)', color:'var(--color-text)', fontSize:'14px',
        fontVariantNumeric:'tabular-nums', opacity:locked?'.6':'1' } });
    inp.addEventListener('change',(e)=>{
      const m = /^(\d{1,2}):(\d{2})$/.exec(e.target.value.trim());
      if(!m){ e.target.value = this.hhmm(at); return; }
      setAt((+m[1]) + (+m[2])/60);
    });

    const body = locked
      ? [ h('div',{ style:{ display:'flex', alignItems:'center', gap:'8px', padding:'10px 12px', borderRadius:'8px',
            background:'var(--color-neutral-900)', border:'1px solid var(--color-divider)', fontSize:'12px', color:muted } },
          h('span',{ html:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2.5" y="6" width="9" height="6" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M4.3 6V4.5a2.7 2.7 0 0 1 5.4 0V6" stroke="currentColor" stroke-width="1.3"/></svg>' }),
          h('span',{}, 'A neighbouring slot already has planning, so this boundary is locked. Structure changes only apply to slots without planning.')) ]
      : [
          h('div',{ style:{ fontSize:'11px', color:muted, marginBottom:'6px' } }, 'CUT AT'),
          h('div',{ style:{ display:'flex', alignItems:'center', gap:'6px' } },
            stepBtn('−', ()=> setAt(at-0.25), at-0.25 < lo-1e-9),
            inp,
            stepBtn('+', ()=> setAt(at+0.25), at+0.25 > hi+1e-9)),
          h('div',{ style:{ fontSize:'11px', color:muted, marginTop:'6px' } },
            'Range '+this.hhmm(lo)+'–'+this.hhmm(hi)+' · 15-min steps'),
          h('button',{ onClick: merge,
            hover:{ background:'color-mix(in srgb, var(--color-text) 6%, transparent)' },
            style:{ marginTop:'14px', width:'100%', height:'36px', display:'flex', alignItems:'center',
              justifyContent:'center', gap:'8px', background:'transparent', border:'1px solid var(--color-divider)',
              borderRadius:'8px', color:'var(--color-text)', cursor:'pointer', fontSize:'14px',
              fontFamily:'var(--font-heading)', fontWeight:'500' } },
            h('span',{ html:'<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3 L7 7 L4 11"/><path d="M10 3 L7 7 L10 11"/></svg>' }),
            'Merge into one slot')
        ];

    return h('div',{ style:{ flex:'0 0 '+panelW+'px', width:panelW+'px' } },
      h('div',{ style:{ height:'16px' } }),
      h('div',{ style:{ border:'1px solid var(--color-divider)', borderRadius:'8px', overflow:'hidden',
        background:'var(--color-surface)', boxShadow:'0 1px 2px rgba(0,0,0,.05)' } },
        // header
        h('div',{ style:{ display:'flex', alignItems:'center', padding:'12px 14px', gap:'8px',
          background:'var(--color-neutral-900)', borderBottom:'1px solid var(--color-divider)' } },
          h('div',{ style:{ flex:'1', minWidth:'0' } },
            h('div',{ style:{ fontWeight:'500' } }, 'Boundary'),
            h('div',{ style:{ fontSize:'11px', color:muted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' } },
              yc.name+' · '+DAYS[day])),
          h('button',{ onClick: close, 'aria-label':'Close',
            hover:{ borderColor:'var(--color-neutral-600)' },
            style:{ width:'28px', height:'28px', flex:'none', display:'flex', alignItems:'center', justifyContent:'center',
              background:'transparent', border:'1px solid var(--color-divider)', borderRadius:'6px',
              color:'var(--color-text)', cursor:'pointer', fontSize:'15px', lineHeight:'1' } }, '×')),
        // adjacent slots
        h('div',{ style:{ padding:'12px 14px' } },
          h('div',{ style:{ display:'flex', alignItems:'center', gap:'6px' } },
            chip(a.start, a.end, a.planned),
            h('span',{ style:{ color:accent, fontSize:'14px' } }, '│'),
            chip(b.start, b.end, b.planned)),
          h('div',{ style:{ height:'12px' } }),
          ...body
        )
      )
    );
  },

  // the rail/panel widths animate over .28s — refit once they've settled
  refitAfterTransition(){ clearTimeout(this._refitT); this._refitT = setTimeout(()=> this.fitTimeline(), 320); },
  // Measure the track and pick the widest hour column that still shows all 24h.
  // Returns true when it had to re-render at a new width.
  // remember the narrowest slot the last build put on screen (in hours), so
  // fitTimeline can size the hour column around it
  noteMinSlot(durations){
    const valid = durations.filter(d=> d > 0.01);
    this._minSlotHours = valid.length ? Math.min.apply(null, valid) : 0;
  },
  fitTimeline(){
    if(this._fitting || !this._scrollEl) return false;
    const avail = this._scrollEl.clientWidth;
    if(avail < 80) return false;
    // widest hour column that still shows all 24h...
    const fitAll = Math.max(this.MIN_HW, Math.min(this.MAX_HW, Math.floor((avail - 16) / 24)));
    // ...unless the narrowest slot on screen would have to squeeze its labels, in
    // which case go wider and let the track scroll
    const mins = this._minSlotHours;
    const needed = (mins && mins > 0) ? Math.ceil(this.SLOT_MIN_PX / mins) : 0;
    const target = Math.min(this.MAX_HW_SCROLL, Math.max(fitAll, needed));
    if(target === this.HOUR_W) return false;
    this._fitting = true;
    this.HOUR_W = target;
    this.render();
    this._fitting = false;
    return true;
  },
  render(){
    const root = document.getElementById('root');
    const prevX = this._scrollEl ? this._scrollEl.scrollLeft : null;
    root.replaceChildren(this.build());
    if(this.fitTimeline()) return;   // re-rendered at the fitted hour width
    if(!this._publishBtn || !root.contains(this._publishBtn)) this._publishBtn = root.querySelector('.btn-primary');
    if(prevX != null && this._scrollEl){
      this._scrollEl.scrollLeft = prevX;
      if(this._rulerEl) this._rulerEl.scrollLeft = prevX;
    } else if(!this._mounted){
      this._mounted = true;
      this._scrollToNowTries = 0;
      const tick = ()=>{ if(!this._scrollEl) return;
        if(this._scrollEl.scrollWidth > this._scrollEl.clientWidth){ this.scrollToNow(); }
        else if(this._scrollToNowTries++ < 20){ setTimeout(tick, 60); } };
      setTimeout(tick, 60);
      this._ticker = setInterval(()=>{
        const ae = document.activeElement;
        if(ae && ae.classList && ae.classList.contains('plan')) return;
        this.render();
      }, 20000);
    }
  },
};

App.loadSlots();
App.state.day = App.wkToday();   // Slot creation opens on today's weekday, matching day-to-day's "today"
App.render();
// flush any debounced write before the tab goes away, so nothing in flight is lost
// refit the timeline when the window (or the sidebar) changes the available width
window.addEventListener('resize', ()=>{ clearTimeout(App._resizeT); App._resizeT = setTimeout(()=> App.render(), 120); });
window.addEventListener('beforeunload', ()=> App.persistNow());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') App.persistNow(); });
</script>
</body>
